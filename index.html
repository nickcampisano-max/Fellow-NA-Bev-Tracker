      <th class="group-header running-total" colspan="2">Running total <span class="sub">(since period start)</span></th>
      <th rowspan="2">Count (opt.)</th>
      <th class="left" rowspan="2">Notes</th>
    </tr>
    <tr>
      <th>Purchased</th>
      <th title="Raw Toast 'Qty sold' for this item — every unit that left the building, paid or comped. This is the CSV import target.">Sold‡</th>
      <th title="Estimated from Comped $ ÷ price, rounded to a whole item. This is a breakdown of Sold — how many of that Sold count were comped — not an additional quantity on top of it.">Comped*</th>
      <th title="The staff-comp perk dollar value, at menu price — same figure as Toast's Discount $ for this item. Locked to CSV import only, not manually editable, so this always matches Toast exactly.">Comped $</th>
      <th title="Beginning inventory + purchased since period start, minus Accounted for — this is what should currently be sitting in the fridge/cooler if nothing's gone wrong. It's a projection based on your records, not a confirmed count. A quick Monday glance in the fridge is the real check; it only becomes solid once you log an actual period-end count.">Expected on hand</th>
      <th title="Cost value of Expected on hand — a working number to track trend week to week, not a confirmed loss. Treat it as a placeholder until a physical count confirms it.">Expected on hand ($)</th>
    </tr>
  </thead>`;
  const tbody = document.createElement('tbody');

  let totUnacctCost=0, totPurchU=0, totUnacctUnits=0;
  let totSoldToGuests=0, totGuestRevenue=0, totComped=0, totDiscount=0, totProfit=0;
  // Same accumulators, restricted to the collapsed group, so its one-line summary row states its
  // own totals rather than a share of the grand total.
  let secPurchU=0, secComped=0, secDiscount=0, secUnacctUnits=0, secUnacctCost=0, secAlerts=0;

  // Order-only items (coffee/tea via Passport) have no sales data and aren't part of NA Bev
  // variance reconciliation — they only appear in the Order Guide.
  const tracked = store.items.filter(it=>!it.orderOnly);
  // Split, not filtered: every tracked item still renders and still lands in the grand total. The
  // nine focus items just render first, above a divider, because a Monday glance that starts with
  // 29 rows is a Monday glance nobody takes. Partitioned here rather than sorted so the collapsed
  // group can carry its own subtotal.
  const focusItems = tracked.filter(isFocusItem);
  const secondaryItems = tracked.filter(it=>!isFocusItem(it));

  const buildRow = (item, isSecondary)=>{
    const carryIn = balanceEnteringWeek(store, period, item, weekIdx);
    const r = computeRow(item, weekData, carryIn);
    totUnacctCost += hasCountForTotals(item, weekData, r).cost;
    totPurchU += r.purchU;
    totUnacctUnits += hasCountForTotals(item, weekData, r).units;
    totSoldToGuests += r.soldToGuests;
    totGuestRevenue += r.guestRevenue;
    totProfit += r.profit;
    totComped += r.comped;
    totDiscount += r.discount;
    if(isSecondary){
      secPurchU += r.purchU;
      secComped += r.comped;
      secDiscount += r.discount;
      secUnacctUnits += hasCountForTotals(item, weekData, r).units;
      secUnacctCost += hasCountForTotals(item, weekData, r).cost;
    }

    const tr = document.createElement('tr');
    // See the threshold's comment in defaultState() — this looks at the actual size of the
    // unaccounted pile (in dollars, so it's comparable across items of very different volume/
    // cost), independent of this week's purchased-vs-sold flow.
    const threshold = state.unaccountedAlertThreshold ?? 50;
    // Fixed: a count logged in THIS week used to leave this week's own Expected on hand frozen on
    // the projection. expectedOnHand() already resets to a logged count, so the count reached every
    // later week, Period Summary, Compare Periods and next period's opening — every place except
    // the row it was typed into, which made the field feel dead. Display-only on purpose:
    // computeRow stays pure and expectedOnHand keeps owning the carry-forward, so the count is
    // never applied twice. Note the guard tests for blank/undefined/NaN rather than falsiness, so a
    // counted ZERO (item ran out) registers as a real count instead of being read as "not counted".
    const countRaw = weekData[item.id].actualCount;
    const hasCount = countRaw !== '' && countRaw !== undefined && !isNaN(parseFloat(countRaw));
    const confirmedUnits = hasCount ? purchasedServings(item, parseFloat(countRaw)) : null;
    const displayUnits = hasCount ? confirmedUnits : r.unaccounted;
    const displayCost  = hasCount ? confirmedUnits * r.cps : r.unaccountedCost;
    const varianceUnits = hasCount ? (confirmedUnits - r.unaccounted) : 0;
    const varianceCost  = hasCount ? (displayCost - r.unaccountedCost) : 0;
    // Two different questions, so two different tests. An UNCOUNTED row asks "is there enough
    // product riding on an unverified projection to be worth a look?" — raw magnitude. A CONFIRMED
    // row has already been looked at, so magnitude is meaningless there: what matters is whether
    // the count disagreed with the records. Testing magnitude on a confirmed row is backwards — a
    // perfect count of a large number screams, and a wildly wrong low count goes quiet.
    // The two thresholds are deliberately different sizes: $50 of standing stock is unremarkable,
    // $50 of variance is 52 Cokes or 4 lb of espresso. Variance gets its own, much tighter number.
    const varThreshold = state.countVarianceThreshold ?? 10;
    const isLargeUnaccounted = hasCount
      ? Math.abs(varianceCost) >= varThreshold
      : Math.abs(r.unaccountedCost) >= threshold;
    // Counted here, not in the accumulator block above, because it depends on isLargeUnaccounted.
    // The collapsed group hides rows, so it must not hide an alert — if something in there is
    // flagged, the summary row says so and says how many.
    if(isSecondary && isLargeUnaccounted) secAlerts++;
    // Gallon-tracked items (Lemonade) show every number in this row as servings-equivalent — every
    // Purchased/Sold/Comped/Accounted-for/Unaccounted figure is in the same unit Gary actually rings
    // at the POS (1 lemonade = 1 serving), converted from gallons purchased via 128oz/gal ÷ pourOz.
    // That wasn't labeled on the numbers themselves at first (just a long note under the item name,
    // which overflowed the table sideways — this version is short on purpose) and Nick read a 141.7
    // unaccounted as "142 ounces," off by 100x+ from the real figure. Now "sv" is on the number
    // itself, with the gallon-equivalent underneath for checking against an actual jug count.
    const unitNote = isBulk(item) ? `servings (${item.pourOz}oz pour)` : '';
    const unitSuffix = isBulk(item) ? ' sv' : '';
    const unaccountedLabel = (isBulk(item)
      ? `${fmtN(displayUnits)} sv<div class="info-note" style="margin:0">≈ ${fmtN(servingsToNative(item, displayUnits))} ${nativeLabel(item)}</div>`
      : fmtN(displayUnits))
      + (hasCount ? `<div class="info-note" style="margin:0; color:var(--green)">&#10003; confirmed by count</div>` : '');
    // "Show the math" toggle — the whole point is Gary shouldn't have to reconstruct this
    // arithmetic by hand to trust the number (which is exactly what tripped Nick up on Coke and
    // the Lemonade gallon conversion). Off by default so the table stays as clean as it was before
    // — expandedUnaccounted persists across this app's full re-renders so it doesn't collapse the
    // instant Gary edits some other field in the table.
    const breakdownKey = item.id + ':' + weekIdx;
    const isExpanded = expandedUnaccounted.has(breakdownKey);
    // Gallon items get their own version of this breakdown, in jugs — the servings-based version
    // (170.7 sv, 29 sv) is exactly the math, but Nick called it "too analytical": nobody thinks in
    // servings-equivalents, they think in jugs bought and drinks poured. Purchased/carried-in
    // convert cleanly back to whole/fractional jugs (the servings math is just an intermediate
    // step, not something Gary needs to see), and only the sold+comped total gets converted to a
    // jug-equivalent, since that's the number that's actually comparable to what's missing.
    const breakdown = isExpanded ? (
      item.unit === 'gallon' ? `
      <div class="info-note" style="margin-top:6px; text-align:left; max-width:220px; white-space:normal">
        Available: ${fmtN(servingsToNative(item, carryIn))} jugs carried in + ${fmtN(r.purchased)} jugs bought = ${fmtN(servingsToNative(item, carryIn + r.purchU))} jugs<br>
        − Poured out: ${fmtN(r.sold)} lemonades sold (${fmtN(r.comped)} of those were comped, already included) = ${fmtN(r.accountedFor)} lemonades (≈${fmtN(servingsToNative(item, r.accountedFor))} jugs)<br>
        = <strong>${fmtN(servingsToNative(item, r.unaccounted))} jugs expected on hand</strong><br>
        ${hasCount ? `Counted: <strong>${fmtN(servingsToNative(item, confirmedUnits))} ${nativeLabel(item)}</strong> &mdash; ${varianceUnits===0?'exactly as predicted':(fmtN(Math.abs(servingsToNative(item, varianceUnits)))+' '+nativeLabel(item)+' '+(varianceUnits<0?'short':'over')+' ('+fmt$(Math.abs(varianceCost))+')')}<br>` : ''}
        Comping those ${fmtN(r.comped)} cost ${fmt$(r.compCost)} in actual product cost (separate from Comped $, which is the menu-price value given away).
      </div>` : `
      <div class="info-note" style="margin-top:6px; text-align:left; max-width:220px; white-space:normal">
        Available: ${fmtN(carryIn)} carried in + ${fmtN(r.purchU)} bought = ${fmtN(carryIn + r.purchU)}${unitSuffix}<br>
        − Accounted for: ${fmtN(r.sold)} sold (${fmtN(r.comped)} of those comped, already included)${r.kitchen ? ' + '+fmtN(r.kitchen)+' kitchen' : ''} = ${fmtN(r.accountedFor)}${unitSuffix}<br>
        = <strong>${fmtN(r.unaccounted)}${unitSuffix} expected on hand</strong><br>
        ${hasCount ? `Counted: <strong>${fmtN(confirmedUnits)}${unitSuffix}</strong> &mdash; ${varianceUnits===0?'exactly as predicted':(fmtN(Math.abs(varianceUnits))+unitSuffix+' '+(varianceUnits<0?'short':'over')+' ('+fmt$(Math.abs(varianceCost))+')')}<br>` : ''}
        Comping those ${fmtN(r.comped)} cost ${fmt$(r.compCost)} in actual product cost (separate from Comped $, which is the menu-price value given away).
      </div>`
    ) : '';
    tr.innerHTML = `
      <td class="left"><strong>${item.name}</strong><div class="info-note" style="margin:0">${unitNote}</div></td>
      <td><input type="text" data-f="purchased" value="${weekData[item.id].purchased}"></td>
      <td><input type="text" data-f="sold" value="${weekData[item.id].sold}"></td>
      <td>${fmtN(r.comped)}</td>
      <td title="Locked to CSV import — not manually editable, so this always matches Toast exactly.">${fmt$(r.discount)}</td>
      <td style="font-weight:700; color:${displayUnits>0?'var(--red)':'var(--ink)'}">${unaccountedLabel} <button type="button" class="info-toggle" data-breakdown-key="${breakdownKey}" title="Show the math behind this number">${isExpanded?'▲':'ⓘ'}</button>${breakdown}</td>
      <td style="${isLargeUnaccounted?'font-weight:700; color:#fb923c;':''}">${fmt$(displayCost)}${isLargeUnaccounted?(hasCount
        ? `<span class="flag alert-large" title="The count came in ${fmtN(Math.abs(varianceUnits))}${unitSuffix} ${varianceUnits<0?'under':'over'} what the records predicted (${fmt$(Math.abs(varianceCost))}), at or above your $${varThreshold} count-variance threshold">&#9888; Count off by ${fmt$(Math.abs(varianceCost))}</span>`
        : `<span class="flag alert-large" title="Expected on hand's dollar value (${fmt$(r.unaccountedCost)}) is at or above your $${threshold} alert threshold — worth an actual glance in the fridge to see if this matches reality">&#9888; Check fridge</span>`):''}</td>
      <td><input type="text" data-f="actualCount" value="${weekData[item.id].actualCount}" placeholder="—"></td>
      <td class="left"><textarea class="note" data-f="notes">${weekData[item.id].notes}</textarea></td>
    `;
    tbody.appendChild(tr);

    wireClick(tr.querySelector('.info-toggle'), ()=>{
      if(expandedUnaccounted.has(breakdownKey)) expandedUnaccounted.delete(breakdownKey);
      else expandedUnaccounted.add(breakdownKey);
      renderStoreViewInPlace();
    });

    // 'change' (fires on blur/Enter), not 'input' (fires per keystroke) — this table's handler
    // re-renders the whole page to recompute Accounted for/Unaccounted/Total, and doing that
    // on every keystroke destroys and rebuilds the very input you're mid-typing into, silently
    // dropping every character after the first (typing "49" only ever saved "4"). 'change' commits
    // once you leave the field, so the browser's native text input handles the typing untouched.
    tr.querySelectorAll('input, textarea').forEach(inp=>{
      inp.addEventListener('change', (e)=>{
        weekData[item.id][e.target.dataset.f] = e.target.value;
        save();
        renderStoreViewInPlace();
      });
    });
  };

  // Section header rows use the full 9-column width. Plain <td colspan> rather than a nested
  // table so every row in both groups stays on one set of column widths — two tables side by side
  // would drift apart the moment one group had a longer item name than the other.
  const sectionRow = (label, sub)=>{
    const tr = document.createElement('tr');
    tr.className = 'section-row';
    tr.innerHTML = `<td class="left" colspan="9"><strong>${label}</strong>${sub?` <span class="sub">${sub}</span>`:''}</td>`;
    return tr;
  };

  tbody.appendChild(sectionRow('Where it&rsquo;s going', 'the nine items that carry the NA Bev number'));
  focusItems.forEach(item=>buildRow(item, false));

  // The collapsed group is built either way — its rows are only appended when expanded, but the
  // subtotal has to be computed from the same buildRow pass that would render them, or the two
  // could disagree. Building then discarding is cheap (20 rows) and guarantees the one-line
  // summary and the expanded rows are always the same numbers.
  const secondaryRows = [];
  const appendTo = tbody.appendChild.bind(tbody);
  tbody.appendChild = (node)=>{ secondaryRows.push(node); return node; };
  secondaryItems.forEach(item=>buildRow(item, true));
  tbody.appendChild = appendTo;

  tbody.appendChild(sectionRow('Everything else', `${secondaryItems.length} items — syrups, teas, waters, alt milks`));
  if(secondaryExpanded){
    secondaryRows.forEach(tr=>tbody.appendChild(tr));
  }
  const trSec = document.createElement('tr');
  trSec.className = 'subtotal-row';
  trSec.innerHTML = `<td class="left"><button type="button" class="btn secondary small" id="toggleSecondary">${secondaryExpanded?'▲ Collapse':'▼ Show all '+secondaryItems.length}</button></td>`
    + `<td>${fmtN(secPurchU)}</td><td></td><td>${fmtN(secComped)}</td><td>${fmt$(secDiscount)}</td>`
    + `<td style="color:${secUnacctUnits>0?'var(--red)':'var(--ink)'}">${fmtN(secUnacctUnits)}</td>`
    + `<td>${fmt$(secUnacctCost)}${secAlerts?` <span class="flag alert-large" title="${secAlerts} item${secAlerts===1?'':'s'} in this group ${secAlerts===1?'is':'are'} flagged — expand to see which">&#9888; ${secAlerts} flagged</span>`:''}</td>`
    + `<td colspan="2"></td>`;
  tbody.appendChild(trSec);

  // total row — column order matches the trimmed header: Item, Purchased, Sold (blank: summing raw
  // Sold across items of different units is meaningless), Comped, Comped $, Expected on hand,
  // Expected on hand ($), [Count/Notes skipped]. Sold to guests / $ / Profit were cut 2026-09-16:
  // twelve columns didn't fit without a horizontal scroll, and a scroll on the one table people
  // check weekly means half of it never gets read. Profit per item was the least-used of the three
  // — the money question here is what left without a sale, not the margin on what did sell.
  // totSoldToGuests/totGuestRevenue/totProfit are still accumulated for the email export.
  const trTot = document.createElement('tr');
  trTot.className='total-row';
  trTot.innerHTML = `<td class="left">Total <span class="sub">(all ${tracked.length})</span></td><td>${fmtN(totPurchU)}</td><td></td><td>${fmtN(totComped)}</td><td>${fmt$(totDiscount)}</td><td style="color:var(--red)">${fmtN(totUnacctUnits)}</td><td>${fmt$(totUnacctCost)}</td><td colspan="2"></td>`;
  tbody.appendChild(trTot);

  table.appendChild(tbody);
  wcard.appendChild(table);
  // Wired after the table is in the DOM, and via wireClick like every other control here, so it
  // survives the full re-render the way the week tabs do.
  wireClick(table.querySelector('#toggleSecondary'), ()=>{
    secondaryExpanded = !secondaryExpanded;
    renderStoreViewInPlace();
  });
  // insertAdjacentHTML, not innerHTML +=: the latter re-serializes and reparses every existing
  // child of wcard (including the week tab buttons wired up above), which silently destroys the
  // click handlers wireClick just attached to them. This was the actual cause of week-switching
  // not working — not a browser quirk, a bug in this line.
  wcard.insertAdjacentHTML('beforeend', `<div class="info-note">*Comped = Comped $ ÷ price, rounded to a whole item — a breakdown of how many of "Sold" were comped, not an extra quantity on top. ‡"Sold" is every unit that left the building, paid or comped — Toast counts a 100%-discounted comp as a sale (at $0 revenue); it only excludes voids, which never appear here. "This week" columns are this week&rsquo;s facts alone. "Expected on hand" and its "($)" are different: the running total since the period started — what your records say should be in the fridge right now, and its cost. That is a projection from purchase and sales records, not a confirmed count. Log a count in the Count column and this week&rsquo;s figure switches to the counted number and shows the variance against the projection. Items are split into the nine that carry the number and everything else; the collapsed group still totals into Total and still raises its flags in its own summary row, so nothing is hidden, just folded. Sold to guests, its revenue column and Profit were removed 2026-09-16 to get the table under one screen width — they are still computed and still appear in the Period Summary email export.</div>`);
  app.appendChild(wcard);

  function renderStoreViewInPlace(){
    render();
  }

  // Period summary card
  renderPeriodSummary(app, store, period);
}

function renderPeriodSummary(app, store, period){
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<div class="rowflex"><h2>Period Summary — ${period.name}</h2>
    <button class="btn secondary small" id="copyEmailBtn">📋 Copy Email</button></div>`;

  let totPurchU=0, totAccounted=0, totProfit=0, totComp=0, totDisc=0;
  let totMissingCost=0, confirmedCount=0;
  const perItem = store.items.filter(it=>!it.orderOnly).map(item=>{
    let pu=0, ac=0, compSum=0, discSum=0, profitSum=0;
    // Purchased/Accounted/Comped/Discount/Profit are each real, distinct events every week (a
    // sale, a purchase, a comp), so summing them across the period's 4 weeks is legitimate — that's
    // just "how much happened this period." Fixed 2026-09-09: carryIn is threaded through so
    // Accounted is measured against carried-in stock + purchases, not purchases alone (see
    // balanceEnteringWeek).
    period.weeks.forEach((w, weekIdx)=>{
      const carryIn = balanceEnteringWeek(store, period, item, weekIdx);
      const r = computeRow(item, w, carryIn);
      pu+=r.purchU; ac+=r.accountedFor; compSum+=r.comped; discSum+=r.discount; profitSum+=r.profit;
    });
    // Product missing is NOT the same kind of number as the above — it's a running stock balance,
    // not a per-week event, so summing it across weeks double/triple/quadruple-counts the same
    // lingering product every week it sits there unsold and unpurchased. Fixed 2026-09-13: reuse
    // expectedOnHand() — the same running-balance primitive the weekly Variance table already
    // trusts — evaluated once at the period's last week, i.e. where things actually stand right
    // now, not summed across every week it was checked. This was the real explanation behind a
    // "Margin never captured" figure Nick correctly called out as way too high.
    const missingUnits = expectedOnHand(store, period, item, period.weeks.length-1);
    const missingCost = missingUnits * costPerServing(item);
    // Confirmed vs. projected, added 2026-09-14: weeks 1-3 never get a physical count by design
    // (that's the whole "Monday glance, not mandatory weekly counts" workflow) — Week 4 is where
    // the real period-end count lands, per item, whenever Gary/Nick actually counts it. If this
    // item has a Week 4 Count entered, expectedOnHand() already resets to that real number
    // internally (see its own logic) — this just makes that fact visible instead of showing every
    // item's missing figure identically, confirmed or not. An item without a Week 4 count is still
    // a pure projection, same as it always was.
    const week4Data = period.weeks[period.weeks.length-1][item.id];
    const confirmed = !!(week4Data && week4Data.actualCount !== '' && week4Data.actualCount !== undefined && !isNaN(parseFloat(week4Data.actualCount)));
    if(confirmed) confirmedCount++;
    totPurchU+=pu; totAccounted+=ac; totComp+=compSum; totDisc+=discSum; totProfit+=profitSum;
    totMissingCost+=missingCost;
    return {item, pu, ac, compSum, discSum, profitSum, missingUnits, missingCost, confirmed};
  });
  const totalTrackedItems = perItem.length;
  let confirmStatus;
  if(confirmedCount===0){
    confirmStatus = `No items have a Week 4 count logged yet — every number here is still a projection, not confirmed.`;
  } else if(confirmedCount===totalTrackedItems){
    confirmStatus = `All ${totalTrackedItems} items have a Week 4 count logged — these numbers are confirmed, not projected.`;
  } else {
    confirmStatus = `${confirmedCount} of ${totalTrackedItems} item${totalTrackedItems===1?'':'s'} ha${confirmedCount===1?'s':'ve'} a Week 4 count logged so far (marked ✓ below) — those are confirmed, the rest are still projections.`;
  }

  // Rebuilt 2026-09-13 around what Nick actually uses this for: overall profit, how much product
  // is going out as a staff comp (in both units and $, not a rate — easier to read at a glance),
  // and how much product can't be explained by either a sale or a comp. Dropped "Retail value if
  // sold" / "Margin never captured" (multiplied an already-uncertain missing-product estimate by
  // full menu price, compounding one soft number into a scarier one) and the "% accounted" / comp-
  // rate / revenue-realized percentages (Comped units/$ and Profit answer the same questions more
  // directly, in dollars and units instead of rates).
  // Dropped the blended "Product missing (units)" KPI 2026-09-13: it summed units across items
  // that don't share a unit (cans/bottles for most items, gallon-equivalent servings for
  // Lemonade), so a single number like "222" couldn't honestly mean anything — Nick correctly
  // called this out as unlabeled and confusing. Product missing ($) is the safe headline instead,
  // since dollars are the one thing every item's missing quantity can be added into meaningfully.
  // Per-item unit counts still live in the table below, where the item name makes the unit obvious.
  const kpis = document.createElement('div');
  kpis.className='kpi-grid';
  kpis.innerHTML = `
    <div class="kpi" title="Total profit on paid sales this period — Sold to guests × (price − cost per serving)."><div class="label">Profit</div><div class="value ${totProfit<0?'red':''}">${fmt$(totProfit)}</div></div>
    <div class="kpi" title="Staff comp units this period — already part of Accounted for, not additional. What's being given to the team, in units."><div class="label">Comped (units)</div><div class="value">${fmtN(totComp)}</div></div>
    <div class="kpi" title="Menu-price value of everything comped this period — same figure as Toast's Discount $, totaled. What's being given to the team, in dollars."><div class="label">Comped ($)</div><div class="value">${fmt$(totDisc)}</div></div>
    <div class="kpi" title="Cost value of Product missing — a projection for most items, confirmed for any item with a Week 4 count logged. Not a sum of every week's snapshot. See the table below for per-item detail and which items are confirmed."><div class="label">Product missing ($)</div><div class="value red">${fmt$(totMissingCost)}</div></div>
  `;
  card.appendChild(kpis);
  card.insertAdjacentHTML('beforeend', `<div class="info-note" style="margin:8px 0 0">Profit and Comped are real totals — every sale and comp this period, added up. Product missing is different: a projection from purchase/sales records, not a confirmed count — unless an item has a Week 4 count logged, which locks that item's number in as the real ending figure instead of a projection. ${confirmStatus} The item table below shows exact units per item — most are cans/bottles, Lemonade is in servings (see its row).</div>`);

  // Sorted worst-first by dollar impact so "which item, how much" is the first thing visible —
  // directly answering "how many Cokes are we missing" without scanning the whole item list.
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th class="left">Item</th><th>Purchased</th><th>Accounted</th><th title="What your records say should currently be in the fridge for this item — a projection, unless a Week 4 count has been logged for it (marked ✓), which makes it the confirmed ending number instead.">Product missing</th><th>Product missing ($)</th><th title="Comped units this period — already part of Accounted, not additional.">Comped</th><th title="Profit on paid sales this period.">Profit</th></tr></thead>`;
  const tb = document.createElement('tbody');

  // Same split as the weekly table, and for the same reason: the nine items that carry the number
  // read first, everything else folds behind a subtotal. Sorted by missing-cost WITHIN each group,
  // so the worst offender in each still surfaces to the top of its own block rather than the split
  // hiding it. 7 columns here, not the week view's 9.
  const buildPeriodRow = (r)=>{
    const {item,pu,ac,compSum,missingUnits,missingCost,profitSum,confirmed} = r;
    const tr = document.createElement('tr');
    const unitNote = isBulk(item) ? `servings (${item.pourOz}oz pour)` : '';
    const confirmNote = confirmed ? `<div class="info-note" style="margin:0; color:var(--green)">&#10003; confirmed by count</div>` : '';
    const missingLabel = isBulk(item)
      ? `${fmtN(missingUnits)}<div class="info-note" style="margin:0">&asymp; ${fmtN(servingsToNative(item, missingUnits))} ${nativeLabel(item)}</div>`
      : fmtN(missingUnits);
    tr.innerHTML = `<td class="left">${item.name}${unitNote?`<div class="info-note" style="margin:0">${unitNote}</div>`:''}${confirmNote}</td><td>${fmtN(pu)}</td><td>${fmtN(ac)}</td><td style="color:${missingUnits>0?'var(--red)':'var(--ink)'}">${missingLabel}</td><td style="color:${missingCost>0?'var(--red)':'var(--ink)'}">${fmt$(missingCost)}</td><td>${fmtN(compSum)}</td><td style="color:${profitSum<0?'var(--red)':'var(--ink)'}">${fmt$(profitSum)}</td>`;
    return tr;
  };
  const periodSectionRow = (label, sub)=>{
    const tr = document.createElement('tr');
    tr.className = 'section-row';
    tr.innerHTML = `<td class="left" colspan="7"><strong>${label}</strong>${sub?` <span class="sub">${sub}</span>`:''}</td>`;
    return tr;
  };

  const byMissing = (a,b)=>b.missingCost-a.missingCost;
  const focusRows = perItem.filter(r=>isFocusItem(r.item)).sort(byMissing);
  const secRows   = perItem.filter(r=>!isFocusItem(r.item)).sort(byMissing);
  // pu / ac / missingUnits are all serving-equivalents here (computeRow converts on the way in), so
  // unlike the week view's raw Sold column these are dimensionally consistent and safe to add.
  const sum = (rows, k)=>rows.reduce((t,r)=>t+r[k],0);

  tb.appendChild(periodSectionRow('Where it&rsquo;s going', 'the nine items that carry the NA Bev number'));
  focusRows.forEach(r=>tb.appendChild(buildPeriodRow(r)));

  tb.appendChild(periodSectionRow('Everything else', `${secRows.length} items — syrups, teas, waters, alt milks`));
  if(periodSecondaryExpanded){ secRows.forEach(r=>tb.appendChild(buildPeriodRow(r))); }
  const trSec = document.createElement('tr');
  trSec.className = 'subtotal-row';
  trSec.innerHTML = `<td class="left"><button type="button" class="btn secondary small" id="togglePeriodSecondary">${periodSecondaryExpanded?'▲ Collapse':'▼ Show all '+secRows.length}</button></td>`
    + `<td>${fmtN(sum(secRows,'pu'))}</td><td>${fmtN(sum(secRows,'ac'))}</td>`
    + `<td style="color:${sum(secRows,'missingUnits')>0?'var(--red)':'var(--ink)'}">${fmtN(sum(secRows,'missingUnits'))}</td>`
    + `<td style="color:${sum(secRows,'missingCost')>0?'var(--red)':'var(--ink)'}">${fmt$(sum(secRows,'missingCost'))}</td>`
    + `<td>${fmtN(sum(secRows,'compSum'))}</td><td>${fmt$(sum(secRows,'profitSum'))}</td>`;
  tb.appendChild(trSec);

  const trPTot = document.createElement('tr');
  trPTot.className = 'total-row';
  trPTot.innerHTML = `<td class="left">Total <span class="sub">(all ${perItem.length})</span></td>`
    + `<td>${fmtN(sum(perItem,'pu'))}</td><td>${fmtN(sum(perItem,'ac'))}</td>`
    + `<td style="color:var(--red)">${fmtN(sum(perItem,'missingUnits'))}</td>`
    + `<td style="color:var(--red)">${fmt$(totMissingCost)}</td>`
    + `<td>${fmtN(totComp)}</td><td>${fmt$(totProfit)}</td>`;
  tb.appendChild(trPTot);

  tbl.appendChild(tb);
  card.appendChild(tbl);
  app.appendChild(card);
  wireClick(tbl.querySelector('#togglePeriodSecondary'), ()=>{
    periodSecondaryExpanded = !periodSecondaryExpanded;
    render();
  });

  renderCostRate(app, store, period);
  renderTransfers(app, store, period);

  wireClick(card.querySelector('#copyEmailBtn'), ()=>{
    const text = generateEmail(store, period, perItem, totMissingCost, totProfit, totComp, totDisc);
    navigator.clipboard.writeText(text).then(()=>showToast('Email copied to clipboard')).catch(()=>{
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); showToast('Email copied to clipboard');
    });
  });
}

// Dollar value of the period's beginning on-hand and its expected/counted ending on-hand. These
// are the two numbers the P&L calls Inventory, and the gap between them is the EOP Adjustment.
function periodInventoryValue(store, period, atEnd){
  return store.items.filter(it=>!it.orderOnly).reduce((sum, item)=>{
    const servings = atEnd
      ? expectedOnHand(store, period, item, period.weeks.length-1)
      : purchasedServings(item, parseFloat(period.beginInv[item.id]) || 0);
    return sum + servings * costPerServing(item);
  }, 0);
}
// Dollar value of everything purchased in the period, at item cost. Native units x native cost —
// deliberately NOT via purchasedServings, because a purchase's dollar value doesn't depend on how
// many drinks a jug pours.
function periodPurchaseValue(store, period){
  return store.items.filter(it=>!it.orderOnly).reduce((sum, item)=>{
    let native = 0;
    period.weeks.forEach(w=>{ native += parseFloat(w[item.id]?.purchased) || 0; });
    return sum + native * (parseFloat(item.cost) || 0);
  }, 0);
}

// ---------- Cost rate ----------
// Added 2026-09-16 after reconciling Fellow's P7-P9 EOP sheet. The P&L computes NA Bev cost as
// (Purchases + EOP Adjustment) / Gross Sales, where EOP Adjustment = opening inventory - closing
// inventory. That makes the headline cost % swing hard on stocking timing rather than on anything
// operational: Fellow's P7 read 29.32% and P8 read 39.48%, but P7 built $245 of inventory that P8
// then drew back down, and paired together the two periods are 34.81%. A ten-point "jump" that was
// never a jump. So this card shows the P&L number AND the two numbers that don't lie: purchases as
// a share of sales (immune to inventory timing), and the size of the inventory swing itself, so
// you can see when the headline is being distorted before you act on it.
function renderCostRate(app, store, period){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>Cost rate &mdash; ${period.name}</h2>`;

  const sales = parseFloat(period.naBevSales) || 0;
  const purchases = periodPurchaseValue(store, period);
  const openInv = periodInventoryValue(store, period, false);
  const closeInv = periodInventoryValue(store, period, true);
  const eopAdj = openInv - closeInv;      // same sign convention as the P&L sheet
  const cogs = purchases + eopAdj;

  const salesRow = document.createElement('div');
  salesRow.className = 'rowflex';
  salesRow.innerHTML = `<label style="margin:0">Gross NA Bev sales this period <span class="sub" style="margin:0">(from Toast or the P&amp;L)</span></label>`;
  const salesInput = document.createElement('input');
  salesInput.type = 'text';
  salesInput.value = period.naBevSales;
  salesInput.placeholder = 'e.g. 3199.50';
  salesInput.style.maxWidth = '160px';
  // 'change', not 'input' — same reason as the week table: this handler re-renders the view.
  salesInput.addEventListener('change', (e)=>{ period.naBevSales = e.target.value; save(); render(); });
  salesRow.appendChild(salesInput);
  card.appendChild(salesRow);

  // Weeks with nothing entered yet are not weeks with zero sales. Mid-period, expectedOnHand()
  // walks all four weeks and the empty ones contribute no consumption, so closing inventory reads
  // artificially high, the inventory change reads as a big build, and the card would confidently
  // tell you that you stocked up and cost got pushed forward. Every Monday, wrongly. So the
  // period's completeness is checked first and the interpretation is held back until it's real.
  const weeksEntered = period.weeks.filter(w=>store.items.some(it=>{
    const d=w[it.id]; return d && ((parseFloat(d.purchased)||0)>0 || (parseFloat(d.sold)||0)>0 || (parseFloat(d.discount)||0)>0);
  })).length;
  const partial = weeksEntered < period.weeks.length;

  const kpis = document.createElement('div');
  kpis.className = 'kpi-grid';
  const pct = (n)=> sales>0 ? (n/sales*100).toFixed(2)+'%' : '&mdash;';
  // Two points of sales is the line where the swing starts moving the headline enough to argue
  // about. Below that it's noise; above it, the cost % is telling you about a delivery date.
  const swingPts = sales>0 ? Math.abs(eopAdj)/sales*100 : 0;
  const swingBad = swingPts >= 2;
  kpis.innerHTML = `
    <div class="kpi"><div class="label">Purchases</div><div class="value">${fmt$(purchases)}</div><div class="sub" style="margin:0">${pct(purchases)} of sales</div></div>
    <div class="kpi"><div class="label" title="Opening inventory minus closing inventory, the same figure the P&L sheet calls EOP Adjustment. Positive means inventory came down and added to cost; negative means you stocked up and cost got pushed into next period.">Inventory change</div><div class="value" style="color:${swingBad&&!partial?'#fb923c':'var(--ink)'}">${partial?'&mdash;':fmt$(eopAdj)}</div><div class="sub" style="margin:0">${partial?'needs a full period':fmt$(openInv)+' &rarr; '+fmt$(closeInv)}</div></div>
    <div class="kpi"><div class="label" title="Purchases + inventory change. This is what physically left inventory this period.">COGS</div><div class="value">${partial?'&mdash;':fmt$(cogs)}</div><div class="sub" style="margin:0">${partial?'needs a full period':pct(cogs)+' of sales'}</div></div>
    <div class="kpi"><div class="label" title="COGS divided by gross sales — the number that shows up on the P&L.">Cost %</div><div class="value" style="color:${!partial&&sales>0&&cogs/sales>=0.30?'var(--red)':'var(--ink)'}">${partial?'&mdash;':pct(cogs)}</div><div class="sub" style="margin:0">${partial?'needs a full period':'P&amp;L headline'}</div></div>
    <div class="kpi"><div class="label" title="Purchases divided by gross sales. Ignores inventory timing entirely, so it does not swing when a delivery lands on the wrong side of a count, and it is readable mid-period. Watch this one week to week.">Purchase rate</div><div class="value">${pct(purchases)}</div><div class="sub" style="margin:0">timing-proof${partial?' &middot; readable now':''}</div></div>`;
  card.appendChild(kpis);

  const note = document.createElement('div');
  note.className = 'info-note';
  if(sales <= 0){
    note.innerHTML = `Enter gross NA Bev sales above to see the percentages. Everything else on this card is computed from purchases, beginning on-hand and the period&rsquo;s ending position, so it is already correct &mdash; only the &ldquo;of sales&rdquo; figures are waiting on that one number.`;
  } else if(partial){
    note.innerHTML = `<strong>${weeksEntered} of ${period.weeks.length} weeks entered &mdash; cost %, COGS and inventory change are held back until the period is complete.</strong> `
      + `They would lie right now: an empty week is not a week with no sales, but the running on-hand treats it as one, so closing inventory reads high and the period would look like it stocked up no matter what actually happened. `
      + `<strong>Purchase rate (${pct(purchases)}) is readable today</strong> &mdash; it is just what you bought over what you sold, and it never depends on a count. That is the number to watch weekly; the rest becomes real when week ${period.weeks.length} is in and the period-end count is logged.`;
  } else if(swingBad){
    note.innerHTML = `<strong style="color:#fb923c">&#9888; Cost % is distorted this period.</strong> Inventory moved ${fmt$(Math.abs(eopAdj))}, worth ${swingPts.toFixed(2)} points of sales, so the ${pct(cogs)} headline is partly a stocking-timing artifact rather than an operational result. ${eopAdj<0?'You stocked up: cost that belongs to this period got pushed into the next one, and this period reads better than it was.':'You drew inventory down: cost from a prior period landed here, and this period reads worse than it was.'} Purchase rate (${pct(purchases)}) is the number to trust &mdash; it ignores inventory timing. Compare two periods together before concluding anything moved.`;
  } else {
    note.innerHTML = `Inventory moved ${fmt$(Math.abs(eopAdj))} this period, ${swingPts.toFixed(2)} points of sales &mdash; small enough that the ${pct(cogs)} cost % is a fair read rather than a timing artifact. Purchase rate (${pct(purchases)}) is the number to watch week to week: it ignores inventory timing entirely, so a delivery landing on the wrong side of a count cannot move it.`;
  }
  card.appendChild(note);
  app.appendChild(card);
}

// ---------- Transfers out ----------
// Product that physically left NA Bev inventory but was consumed by another department, so its
// cost belongs on that department's line. At Fellow this is real and measurable: the kitchen's
// tempura batter takes 7.2 bottles of club soda per batch, and every espresso martini pulls 2oz of
// NA Bev espresso while ringing as a bar sale. Both are already inside COGS above — this card does
// not change COGS, it attributes part of it, so Nick can say "cost read X%, transfers were Y
// points, true NA Bev cost was Z%" with the arithmetic shown rather than asserted.
function renderTransfers(app, store, period){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="rowflex"><h2>Transfers out &mdash; bar &amp; kitchen</h2><button class="btn secondary small" id="addTransferBtn">+ Add transfer</button></div>`;

  const sales = parseFloat(period.naBevSales) || 0;
  const tracked = store.items.filter(it=>!it.orderOnly);
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th class="left">Item</th><th class="left">Goes to</th><th>Units (native)</th><th>Cost</th><th title="What this transfer is worth as a share of NA Bev sales — how many points it takes off the cost %.">Points of cost %</th><th class="left">Note</th><th></th></tr></thead>`;
  const tb = document.createElement('tbody');

  let totCost = 0;
  period.transfers.forEach((t, idx)=>{
    const item = store.items.find(i=>i.id===t.itemId);
    // Native units x native cost, matching periodPurchaseValue — somebody counts bottles and
    // pounds, not serving-equivalents, so that's what gets typed and that's what gets costed.
    const cost = item ? (parseFloat(t.units)||0) * (parseFloat(item.cost)||0) : 0;
    totCost += cost;
    const tr = document.createElement('tr');
    const itemOpts = tracked.map(i=>`<option value="${i.id}"${i.id===t.itemId?' selected':''}>${i.name}</option>`).join('');
    tr.innerHTML = `
      <td class="left"><select data-tf="itemId">${itemOpts}</select></td>
      <td class="left"><select data-tf="dest"><option value="kitchen"${t.dest==='kitchen'?' selected':''}>Kitchen</option><option value="bar"${t.dest==='bar'?' selected':''}>Bar</option></select></td>
      <td><input type="text" data-tf="units" value="${t.units ?? ''}" style="max-width:90px"><div class="info-note" style="margin:0">${item?nativeLabel(item):''}</div></td>
      <td>${fmt$(cost)}</td>
      <td>${sales>0 ? (cost/sales*100).toFixed(2)+' pts' : '&mdash;'}</td>
      <td class="left"><input type="text" data-tf="note" value="${(t.note||'').replace(/"/g,'&quot;')}" placeholder="e.g. tempura, 2.8 batches/wk"></td>
      <td><button type="button" class="btn secondary small" data-tf-remove="${idx}">Remove</button></td>`;
    tr.querySelectorAll('[data-tf]').forEach(el=>{
      el.addEventListener('change', (e)=>{ t[e.target.dataset.tf] = e.target.value; save(); render(); });
    });
    wireClick(tr.querySelector('[data-tf-remove]'), ()=>{ period.transfers.splice(idx,1); save(); render(); });
    tb.appendChild(tr);
  });

  if(!period.transfers.length){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="left" colspan="7"><span class="sub" style="margin:0">Nothing logged yet. Add a transfer once somebody has actually measured it &mdash; a guess here moves the cost % just as much as a real number does.</span></td>`;
    tb.appendChild(tr);
  } else {
    const tr = document.createElement('tr');
    tr.className = 'total-row';
    tr.innerHTML = `<td class="left">Total</td><td></td><td></td><td>${fmt$(totCost)}</td><td>${sales>0?(totCost/sales*100).toFixed(2)+' pts':'&mdash;'}</td><td colspan="2"></td>`;
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  card.appendChild(tbl);

  const note = document.createElement('div');
  note.className = 'info-note';
  if(sales > 0 && totCost > 0){
    const purchases = periodPurchaseValue(store, period);
    const cogs = purchases + (periodInventoryValue(store, period, false) - periodInventoryValue(store, period, true));
    const headline = cogs/sales*100, pts = totCost/sales*100;
    // Same completeness guard as the cost-rate card: mid-period the headline is not a real
    // cost %, so subtracting transfer points from it would produce a confident wrong answer.
    const weeksEntered = period.weeks.filter(w=>store.items.some(it=>{
      const d=w[it.id]; return d && ((parseFloat(d.purchased)||0)>0 || (parseFloat(d.sold)||0)>0 || (parseFloat(d.discount)||0)>0);
    })).length;
    if(weeksEntered < period.weeks.length){
      note.innerHTML = `<strong>Transfers so far: ${fmt$(totCost)}, worth ${pts.toFixed(2)} points of NA Bev sales.</strong> `
        + `The true-cost subtraction waits for a complete period &mdash; with ${weeksEntered} of ${period.weeks.length} weeks entered the cost % is not a real number yet, and taking points off a number that is not real would just move the error. `
        + `The points figure above is already valid, since it only needs the transfer and the sales.`;
      card.appendChild(note); app.appendChild(card);
      wireClick(card.querySelector('#addTransferBtn'), ()=>{
        const first = tracked[0];
        period.transfers.push({itemId: first ? first.id : '', units:'', dest:'kitchen', note:''});
        save(); render();
      });
      return;
    }
    note.innerHTML = `<strong>NA Bev cost read ${headline.toFixed(2)}%. Transfers to the bar and kitchen account for ${pts.toFixed(2)} points. True NA Bev cost: ${(headline-pts).toFixed(2)}%.</strong> `
      + `That product is still bought, still counted and still inside COGS &mdash; this only says whose line it belongs on. It is not a credit until the other department&rsquo;s cost goes up by the same ${fmt$(totCost)}.`;
  } else {
    note.innerHTML = `Log measured transfers here and the card computes what they are worth in dollars and in points off the NA Bev cost %. Units are in each item&rsquo;s native unit &mdash; bottles, pounds, gallons &mdash; because that is what somebody can actually count. This never changes COGS; it attributes part of it.`;
  }
  card.appendChild(note);
  app.appendChild(card);

  wireClick(card.querySelector('#addTransferBtn'), ()=>{
    const first = tracked[0];
    period.transfers.push({itemId: first ? first.id : '', units:'', dest:'kitchen', note:''});
    save(); render();
  });
}

function generateEmail(store, period, perItem, totMissingCost, totProfit, totComp, totDisc){
  let lines = [];
  lines.push(`Subject: NA Beverage Purchase vs. Sales Variance — ${store.name} (${period.name}${period.startDate ? ', starting '+period.startDate : ''})`);
  lines.push('');
  lines.push('Team,');
  lines.push('');
  lines.push(`Purchasing vs. sales on NA Bev for the period, all channels included.`);
  lines.push('');
  perItem.slice().sort((a,b)=>b.missingCost-a.missingCost).forEach(({item,pu,ac,missingUnits,missingCost,confirmed})=>{
    const unitLabel = isBulk(item) ? 'servings' : 'units';
    lines.push(`${item.name} — Purchased: ${fmtN(pu)} | Accounted for: ${fmtN(ac)} | Product missing: ${fmtN(missingUnits)} ${unitLabel} (${fmt$(missingCost)})${confirmed?' [confirmed by count]':' [projection]'}`);
  });
  lines.push('');
  // Total line intentionally skips a units figure — Product missing sums across items that don't
  // share a unit (cans/bottles vs. Lemonade's gallon-equivalent servings), so a single blended
  // count wouldn't mean anything. $ is the one number that's safe to add across different items.
  lines.push(`Total — Product missing: ${fmt$(totMissingCost)} | Profit: ${fmt$(totProfit)} | Comped: ${fmtN(totComp)} units (${fmt$(totDisc)} at menu price).`);
  lines.push('');
  lines.push(`"Accounted for" is Sold + Kitchen use — Sold already includes every employee comp (Toast counts a comped item as sold at $0, not as a void), so comps aren't missing from this number, they're inside it.`);
  lines.push('');
  lines.push(`"Product missing" is a projection from purchase/sales records as of this period's most recent week, not a confirmed count — it's what should be sitting in the fridge right now if nothing's gone wrong.`);
  lines.push('');
  lines.push(`This isn't about the employee meal comp perk — that stays as is. Just tightening up the numbers.`);
  lines.push('');
  lines.push('Next: a Monday glance in the fridge against Product missing on the flagged items, plus a real count at period end to confirm.');
  lines.push('');
  lines.push('Nick');
  return lines.join('\n');
}

// ---------- Order Guide ----------
// Forward-looking decision support for whoever's placing NA Bev orders (Gary) — deliberately kept
// separate from the Variance view's job (retrospective: did what we bought show up as a sale).
// This view answers a different question: given usage so far, what should the next order be. It
// shares the same store/item config and the same period+week the Variance view is on, but reads
// its own `orders` log rather than writing to `weeks`.
function renderOrderGuide(app){
  const store = getActiveStore();
  if(store.items.length===0){
    const card = document.createElement('div');
    card.className='card empty-state';
    card.innerHTML = `<div>No items configured for <strong>${store.name}</strong> yet.</div>
      <button class="btn" id="goSettingsOG">Set up items in Settings</button>`;
    app.appendChild(card);
    wireClick(card.querySelector('#goSettingsOG'), ()=>{ state.activeView='settings'; save(); render(); });
    return;
  }
  ensureActivePeriod(store);
  const periodIdx = store._activePeriodIdx;
  const period = store.periods[periodIdx];
  const weekIdx = store._activeWeekIdx;

  const head = document.createElement('div');
  head.className = 'card';
  head.innerHTML = `<div class="rowflex">
    <div>
      <h2 style="margin-bottom:2px">Order Guide — ${store.name}</h2>
      <div class="info-note" style="margin:0">${period.name}, Week ${weekIdx+1}${period.startDate?' · starting '+period.startDate:''}. Order windows below are real vendor cadence (Shamrock 3x/wk, Passport weekly), not tied to this week boundary the way the Variance view is — use the selector just to pick which week's orders you're logging.</div>
    </div>
    <select id="ogWeekSelect"></select>
  </div>`;
  app.appendChild(head);
  const wsel = head.querySelector('#ogWeekSelect');
  [0,1,2,3].forEach(i=>{
    const o=document.createElement('option'); o.value=i; o.textContent='Week '+(i+1); if(i===weekIdx) o.selected=true;
    wsel.appendChild(o);
  });
  wsel.onchange = ()=>{ store._activeWeekIdx = parseInt(wsel.value); save(); render(); };

  const orderData = period.orders[weekIdx];

  // Group items by vendor, in the order vendors first appear in store.items (Shamrock, then
  // Passport, matching Gary's sheet), so each vendor gets its own table with its own order-window
  // columns — one submission per vendor is how he actually places these.
  const vendors = [];
  store.items.forEach(it=>{
    const v = it.vendor || '(no vendor)';
    if(!vendors.includes(v)) vendors.push(v);
  });

  vendors.forEach(vendor=>{
    const items = store.items.filter(it=>(it.vendor||'(no vendor)')===vendor);
    const slots = slotsForVendor(vendor==='(no vendor)' ? '' : vendor);

    const card = document.createElement('div');
    card.className = 'card';
    let html = `<h2 style="margin-bottom:10px">${vendor}</h2>`;
    html += `<table><thead><tr>
      <th class="left">Item</th>
      <th class="left">Size</th>
      <th>Unit price</th>
      <th>Avg wk usage*</th>
      <th>Par target</th>
      <th>Est. on-hand†</th>
      <th>Suggested (wk)</th>`;
    slots.forEach(label=>{ html += `<th class="left">${label}</th>`; });
    html += `</tr></thead><tbody>`;
    card.innerHTML = html;
    const tbody = document.createElement('tbody');

    items.forEach(item=>{
      // Fixed 2026-09-09: this used to fall back to the generic, meaningless "units" for can items
      // (Coke etc.) and label Avg wk usage/Par target "svg" (servings) even for those same can
      // items, when those two numbers are already in native units for anything that isn't
      // gallon-tracked — servingsToNative only actually converts gallon items, so a can item's
      // "avg usage" was already a plain can count with a nonsense unit slapped on it. Every number
      // in this row now shows the same real, physical unit — the one Gary would write on an actual
      // order (cans, jugs, lbs, cases) — matching what "Purchased" means on the Variance side, so
      // ordering and reconciliation never disagree about what "1" means for a given item.
      const unitLabel = nativeLabel(item) === 'unit' ? 'units' : nativeLabel(item);
      let avgUsage=null, parTarget=null, onHand=null, suggestedNative=null;
      if(!item.orderOnly){
        avgUsage = trailingAvgUsage(store, item, periodIdx, weekIdx);
        const mult = item.parMultiplier ?? 1.3;
        parTarget = avgUsage===null ? null : avgUsage * mult;
        // Through-and-including this week, not just entering it — the freshest running balance
        // available, reflecting whatever's been imported/entered for this week so far. This is a
        // whole-week figure; with real sales data only arriving at weekly granularity, splitting
        // it further across Shamrock's 3 order windows would be false precision, so "Suggested"
        // stays a per-week guide even though logging below is per order window.
        onHand = expectedOnHand(store, period, item, weekIdx);
        const suggestedServings = parTarget===null ? null : Math.max(0, parTarget - onHand);
        suggestedNative = suggestedServings===null ? null : servingsToNative(item, suggestedServings);
      }
      const last = lastOrder(store, periodIdx, weekIdx, item);

      const tr = document.createElement('tr');
      let rowHtml = `
        <td class="left"><strong>${item.name}</strong>${last ? `<div class="info-note" style="margin:0">Last: ${fmtN(last.qty)} ${unitLabel} · ${last.date||'no date'} (${last.label})</div>` : ''}</td>
        <td class="left">${item.sizeLabel||''}</td>
        <td>${item.cost ? fmt$(item.cost) : '—'}</td>
        <td>${avgUsage===null ? '—' : fmtWhole(servingsToNative(item, avgUsage))+' '+unitLabel}</td>
        <td>${parTarget===null ? '—' : fmtWhole(servingsToNative(item, parTarget))+' '+unitLabel}</td>
        <td>${onHand===null ? '—' : fmtWhole(servingsToNative(item, onHand))+' '+unitLabel}</td>
        <td style="font-weight:700; color:${suggestedNative ? 'var(--teal)':'var(--ink)'}">${suggestedNative===null?'—':fmtWholeUp(suggestedNative)+' '+unitLabel}</td>
      `;
      const arr = orderData[item.id] || [];
      slots.forEach((label, s)=>{
        const entry = arr[s] || {qty:'', date:''};
        rowHtml += `<td class="left"><input type="text" style="width:60px" data-slot="${s}" data-f="qty" value="${entry.qty}" placeholder="${unitLabel}" title="Enter the order quantity in ${unitLabel} — same unit as Suggested above, and what you'd log as Purchased once it arrives.">
          <input type="text" style="width:88px" data-slot="${s}" data-f="date" value="${entry.date}" placeholder="date"></td>`;
      });
      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
      tr.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('input', (e)=>{
          const s = parseInt(e.target.dataset.slot);
          if(!Array.isArray(orderData[item.id])) orderData[item.id] = slots.map(()=>({qty:'',date:''}));
          if(!orderData[item.id][s]) orderData[item.id][s] = {qty:'', date:''};
          orderData[item.id][s][e.target.dataset.f] = e.target.value;
          save();
        });
      });
    });

    const table = card.querySelector('table');
    table.appendChild(tbody);
    app.appendChild(card);
  });

  const noteCard = document.createElement('div');
  noteCard.className = 'card';
  noteCard.insertAdjacentHTML('beforeend', `<div class="info-note">Every number in a row — Avg wk usage, Par target, Est. on-hand, Suggested, and the qty you type below — is in the same physical unit (cans, jugs, lbs, or cases, shown on each), the same unit you'd write on an actual order and the same one "Purchased" uses on the Sales vs Purchasing tab. All whole numbers here — you can't buy a fraction of a can or a jug. Suggested specifically rounds up rather than down, so it never quietly recommends ordering short. Ordering in cases instead of individual cans? Convert using the count in the Size column (e.g. "24/cs" = 24 per case). *Avg wk usage = trailing average of Accounted for (Sold + Kitchen use — Sold already includes comps) over the last up to 4 weeks with real data entered, spanning back across prior periods if needed. Order-only items (no sales data, e.g. Passport coffee/tea) always show "—" here — nothing to base a suggestion on. †Est. on-hand = beginning inventory rolled forward through purchased-vs-accounted flow (same running balance as the Variance view), as of whatever's been imported/entered so far this week. Suggested = Par target (avg usage × per-item multiplier, set in Settings) − Est. on-hand, floored at zero — a whole-week guide, not split per order window. Log actual order qty/date per window below; it becomes "Last order" the next time you view this item.</div>`);
  app.appendChild(noteCard);
}

// ---------- Compare view ----------
// Was "Cross-Store Comparison" (one row per store, each store's latest period) back when there
// were multiple stores. With only Central Phoenix left, comparing stores would collapse to a
// single row — not useful. Repurposed to compare periods instead: one row per period for this
// store, so you can see whether % accounted / unaccounted cost are trending in the right
// direction period over period, which nothing else in the app currently shows (Period Summary
// only ever shows one period at a time).
function renderCompare(app){
  const store = getActiveStore();
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2>Compare Periods — ${store.name}</h2><div class="info-note" style="margin-bottom:10px">Each period's totals side by side, oldest to newest, so you can see whether things are trending in the right direction.</div>`;

  const rows = [];
  if(store.items.length>0){
    store.periods.forEach(period=>{
      let totPurchU=0, totAccounted=0, totAvail=0, totMissingCost=0;
      let worst = null;
      store.items.filter(it=>!it.orderOnly).forEach(item=>{
        // Fixed 2026-09-09: same carryIn bug as Period Summary — computeRow(item,w) with no third
        // argument silently ignored beginning inventory, so a period that opened with real
        // beginning-inventory (like P9) showed accounted-for outrunning purchased and swung
        // negative/>100%. Now uses balanceEnteringWeek() like the Variance table, and "% accounted"
        // is measured against available (carryIn + purchased), not purchased alone.
        let pu=0, ac=0, av=0;
        period.weeks.forEach((w, weekIdx)=>{
          const carryIn = balanceEnteringWeek(store, period, item, weekIdx);
          const r = computeRow(item, w, carryIn);
          pu+=r.purchU; ac+=r.accountedFor; av+=carryIn+r.purchU;
        });
        // Fixed 2026-09-13: Product missing ($) is a running stock balance, not a per-week event —
        // summing it across weeks (the old `uc += r.unaccountedCost` here) double/triple-counted
        // the same lingering product every week it sat unsold. Same fix as Period Summary: reuse
        // expectedOnHand() evaluated once at the period's last week, not summed across all 4.
        const missingCost = expectedOnHand(store, period, item, period.weeks.length-1) * costPerServing(item);
        totPurchU+=pu; totAccounted+=ac; totAvail+=av; totMissingCost+=missingCost;
        const pct = av>0 ? ac/av*100 : 100;
        if(!worst || pct < worst.pct) worst = {name:item.name, pct};
      });
      const pctAcct = totAvail>0 ? (totAccounted/totAvail*100) : null;
      rows.push({name: period.name, startDate: period.startDate, pctAcct, totMissingCost, worst});
    });
  }

  if(rows.length===0){
    card.insertAdjacentHTML('beforeend', `<div class="empty-state">No periods yet.</div>`);
    app.appendChild(card);
    return;
  }

  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th class="left">Period</th><th class="left">Start date</th><th>% accounted</th><th title="Cost value of what's missing as of the period's last week — a working number, confirmed only by an actual count.">Product missing ($)</th><th class="left">Worst item</th></tr></thead>`;
  const tb = document.createElement('tbody');
  rows.forEach(r=>{
    const flag = r.pctAcct===null ? '' : r.pctAcct<70?'red':r.pctAcct<85?'yellow':'green';
    tb.appendChild(Object.assign(document.createElement('tr'), {innerHTML:
      `<td class="left">${r.name}</td><td class="left">${r.startDate||'—'}</td>
       <td>${r.pctAcct===null?'—':'<span class="flag '+flag+'">'+r.pctAcct.toFixed(0)+'%</span>'}</td>
       <td>${fmt$(r.totMissingCost)}</td>
       <td class="left">${r.worst ? r.worst.name+' ('+r.worst.pct.toFixed(0)+'%)' : '—'}</td>`
    }));
  });
  tbl.appendChild(tb);
  card.appendChild(tbl);

  const chartWrap = document.createElement('div');
  chartWrap.className='compare-bar-wrap';
  const canvas = document.createElement('canvas');
  chartWrap.appendChild(canvas);
  card.appendChild(chartWrap);
  app.appendChild(card);

  new Chart(canvas, {
    type:'bar',
    data:{
      labels: rows.map(r=>r.name),
      datasets:[{ label:'Product missing ($)', data: rows.map(r=>Math.round(r.totMissingCost*100)/100),
        backgroundColor:'#2dd4bf', borderRadius:6 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ ticks:{color:'#8996a5'}, grid:{color:'rgba(255,255,255,.05)'} },
        y:{ ticks:{color:'#8996a5'}, grid:{color:'rgba(255,255,255,.05)'} }
      }
    }
  });
}

// ---------- Settings ----------
function renderSettings(app){
  const backupCard = document.createElement('div');
  backupCard.className = 'card';
  backupCard.innerHTML = `<h3>Backup &amp; Handoff</h3>
    <div class="info-note" style="margin-bottom:8px">Everything in this app — periods, sales, purchases, orders, item setup — lives only in this browser. Nothing syncs automatically between devices, even on the same link. To hand this off to someone else (or move to a new device), export a backup here and have them import it once on their end. This is a one-time snapshot, not live sync — re-export and re-share whenever you want the other side to catch up.</div>
    <div class="rowflex" style="gap:10px; flex-wrap:wrap">
      <button class="btn secondary small" id="exportBtn">⬇ Export backup (.json)</button>
      <label class="btn secondary small" style="cursor:pointer; margin:0">⬆ Import backup (.json)
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </label>
    </div>`;
  app.appendChild(backupCard);
  wireClick(backupCard.querySelector('#exportBtn'), exportStateFile);
  backupCard.querySelector('#importFile').addEventListener('change', (e)=>{
    importStateFile(e.target.files[0]);
    e.target.value = '';
  });

  const alertCard = document.createElement('div');
  alertCard.className = 'card';
  alertCard.innerHTML = `<h3>Alerts</h3>
    <div class="info-note" style="margin-bottom:8px">Any week where an item's Expected on hand ($) is at or above this dollar amount gets a "⚠ Check fridge" badge in the Variance table — a nudge to go actually look, not a confirmed loss.</div>
    <div class="settings-field"><label>Alert threshold ($)</label><input type="text" id="alertThreshold" value="${state.unaccountedAlertThreshold ?? 50}" style="width:90px"></div>
    <div class="info-note" style="margin:10px 0 8px">Once a row has an actual count logged, the badge stops asking "is this a lot of product?" and starts asking "did the count disagree with the records?" — a different question that needs a much smaller number. $50 of standing stock is unremarkable; $50 of <em>variance</em> is 52 Cokes or 4 lb of espresso.</div>
    <div class="settings-field"><label>Count variance threshold ($)</label><input type="text" id="varThreshold" value="${state.countVarianceThreshold ?? 10}" style="width:90px"></div>`;
  app.appendChild(alertCard);
  alertCard.querySelector('#alertThreshold').addEventListener('change', (e)=>{
    const v = parseFloat(e.target.value);
    state.unaccountedAlertThreshold = isNaN(v) ? 50 : v;
    save(); render();
  });
  alertCard.querySelector('#varThreshold').addEventListener('change', (e)=>{
    const v = parseFloat(e.target.value);
    state.countVarianceThreshold = isNaN(v) ? 10 : v;
    save(); render();
  });

  Object.keys(state.stores).forEach(key=>{
    const store = state.stores[key];
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<div class="rowflex"><h2>${store.name}</h2><button class="btn small secondary" data-add="${key}">+ Add item</button></div>`;
    const list = document.createElement('div');
    store.items.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className='settings-item';
      row.innerHTML = `
        <div class="settings-field"><label>Name</label><input type="text" class="wide" data-k="name" value="${item.name}"></div>
        <div class="settings-field"><label>Unit</label>
          <select data-k="unit">
            <option value="can" ${item.unit==='can'?'selected':''}>can/unit</option>
            <option value="gallon" ${item.unit==='gallon'?'selected':''}>bulk (portioned)</option>
          </select>
        </div>
        <div class="settings-field"><label>Unit name</label><input type="text" data-k="unitLabel" value="${item.unitLabel ?? ''}" placeholder="gal, lb, case, qt, btl"></div>
        <div class="settings-field"><label>Oz per unit (bulk)</label><input type="text" data-k="unitOz" value="${item.unitOz ?? ''}" placeholder="128 gal, 16 lb"></div>
        <div class="settings-field"><label>Price ($)</label><input type="text" data-k="price" value="${item.price}"></div>
        <div class="settings-field"><label>Cost ($)</label><input type="text" data-k="cost" value="${item.cost}"></div>
        <div class="settings-field"><label>Pour oz (gallon items)</label><input type="text" data-k="pourOz" value="${item.pourOz ?? ''}"></div>
        <div class="settings-field"><label>Default kitchen use/wk</label><input type="text" data-k="defaultKitchen" value="${item.defaultKitchen ?? 0}"></div>
        <div class="settings-field"><label>Par multiplier</label><input type="text" data-k="parMultiplier" value="${item.parMultiplier ?? 1.3}"></div>
        <div class="settings-field"><label>Vendor</label><input type="text" data-k="vendor" value="${item.vendor ?? ''}" placeholder="e.g. Shamrock"></div>
        <div class="settings-field"><label>Size (Order Guide)</label><input type="text" data-k="sizeLabel" value="${item.sizeLabel ?? ''}" placeholder="e.g. 12 oz (24/cs)"></div>
        <div class="settings-field"><label>Order-only (no sales data)</label>
          <select data-k="orderOnly">
            <option value="false" ${!item.orderOnly?'selected':''}>No</option>
            <option value="true" ${item.orderOnly?'selected':''}>Yes</option>
          </select>
        </div>
        <button class="btn danger small" data-remove="${idx}">Remove</button>
      `;
      row.querySelectorAll('input,select').forEach(inp=>{
        inp.addEventListener('change', (e)=>{
          const k = e.target.dataset.k;
          let v = e.target.value;
          if(['price','cost','pourOz','unitOz','defaultKitchen','parMultiplier'].includes(k)) v = v===''? null : parseFloat(v);
          if(k==='orderOnly') v = v==='true';
          const vendorChanged = k==='vendor' && v!==item.vendor;
          item[k]=v;
          if(vendorChanged){
            // Order-window slot count depends on vendor — resize every existing orders entry for
            // this item so the UI and data stay in sync (migrateOrders would also catch this on
            // next reload, but doing it now means it's correct immediately, no refresh needed).
            store.periods.forEach(p=>{
              if(!Array.isArray(p.orders)) return;
              p.orders.forEach(o=>{
                const nSlots = slotsForVendor(item.vendor).length;
                let cur = Array.isArray(o[item.id]) ? o[item.id] : [];
                while(cur.length < nSlots) cur.push({qty:'', date:''});
                if(cur.length > nSlots) cur = cur.slice(0, nSlots);
                o[item.id] = cur;
              });
            });
          }
          save();
        });
      });
      wireClick(row.querySelector('[data-remove]'), ()=>{
        store.items.splice(idx,1); save(); render();
      });
      list.appendChild(row);
    });
    card.appendChild(list);
    wireClick(card.querySelector('[data-add]'), ()=>{
      const newItem = {id:'item'+Date.now(), name:'New Item', unit:'can', unitLabel:'', unitOz:null, price:0, cost:0, pourOz:null, defaultKitchen:0, kitchenNote:'', parMultiplier:1.3, vendor:'', sizeLabel:'', orderOnly:false};
      store.items.push(newItem);
      store.periods.forEach(p=>{
        p.weeks.forEach(w=>{ w[newItem.id] = {purchased:0,sold:0,discount:0,kitchen:0,notes:'',actualCount:''}; });
        if(Array.isArray(p.orders)) p.orders.forEach(o=>{ o[newItem.id] = slotsForVendor(newItem.vendor).map(()=>({qty:'', date:''})); });
      });
      save(); render();
    });
    app.appendChild(card);
  });

  const resetCard = document.createElement('div');
  resetCard.className='card';
  resetCard.innerHTML = `<h3>Reset</h3><div class="info-note" style="margin-bottom:8px">Clears all tracked data for every store. Item configuration is kept.</div>
    <button class="btn danger small" id="resetData">Clear all weekly data</button>`;
  wireClick(resetCard.querySelector('#resetData'), ()=>{
    if(confirm('Clear all weekly/period data for every store? Item settings will be kept.')){
      Object.values(state.stores).forEach(s=>{ s.periods=[]; s._activePeriodIdx=undefined; s._activeWeekIdx=undefined; });
      save(); render();
    }
  });
  app.appendChild(resetCard);
}

// Safety net: without this, dropping a file anywhere on the page outside an active dropzone
// makes the browser navigate away to display the raw file instead of doing nothing.
window.addEventListener('dragover', (e)=> e.preventDefault());
window.addEventListener('drop', (e)=> e.preventDefault());

// Single delegated click listener backing every wireClick() button (see wireClick above). This
// listener is attached once, to `document`, and never gets removed/recreated — unlike the
// buttons themselves, which are torn down and rebuilt on every render(). Delegating from a
// stable, permanent element is what makes clicks reliably register.
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-clickable]');
  if(el && typeof el.__clickHandler === 'function') el.__clickHandler(e);
});

render();
</script>
</body>
</html>
