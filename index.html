<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NA Bev Variance Tracker</title>
<style>
  :root {
    color-scheme: dark;
    --teal: #2dd4bf;
    --teal-ink: #06201d;
    --teal-glow: rgba(45,212,191,.35);
    --bg: #0a0e13;
    --bg2: #0d131a;
    --card: #131a22;
    --card2: #182029;
    --border: #232d38;
    --ink: #e9edf2;
    --muted: #8996a5;
    --green: #4ade80;
    --green-bg: #123321;
    --yellow: #fbbf24;
    --yellow-bg: #3a2a08;
    --red: #f87171;
    --red-bg: #3a1414;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 15% -10%, #10202080 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, #0f2a2a70 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
  }

  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; }
  h1 {
    font-size: 21px; margin: 0 0 2px; letter-spacing: -.01em;
    background: linear-gradient(90deg, #fff, var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .tabbar { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab {
    padding: 9px 14px; cursor: pointer; border: none; background: transparent;
    font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent;
    margin-bottom: -1px; transition: color .15s;
  }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
  .tab:hover { color: var(--ink); }

  .card {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    /* A wide table (more columns than the card can fit) scrolls within its own card instead of
       stretching the whole page sideways — that page-wide drift was the actual "layout looks
       broken" complaint, not the table itself being wrong. Harmless on cards with no table:
       nothing overflows, so no scrollbar ever appears. */
    max-width: 100%; overflow-x: auto;
  }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink); }
  .card h3 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .rowflex { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--teal); color: var(--teal-ink); border: none; border-radius: 7px; padding: 8px 14px;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: box-shadow .15s, transform .1s;
    box-shadow: 0 0 0 0 var(--teal-glow);
  }
  .btn:hover { box-shadow: 0 0 16px 1px var(--teal-glow); transform: translateY(-1px); }
  .btn.secondary { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }

  .weektabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .weektab {
    padding: 7px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--card2);
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .weektab.active { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }

  table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  th, td { padding: 6px 6px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  td:first-child, th:first-child { text-align: left; }
  td.left, th.left { text-align: left; }
  tr.total-row td { font-weight: 700; border-top: 2px solid var(--teal); border-bottom: none; color: var(--ink); }
  tr.section-row td { background: var(--teal-bg, rgba(45,212,191,.08)); text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; padding-top: 14px; }
  tr.section-row td .sub { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 11.5px; margin: 0; }
  tr.subtotal-row td { font-weight: 600; color: var(--muted); border-top: 1px dashed var(--line, #333); }
  tr.subtotal-row td:first-child { padding: 6px 8px; }

  input[type=text], input[type=number] {
    width: 56px; border: 1px solid var(--border); border-radius: 5px; padding: 5px 4px;
    font-size: 12.8px; text-align: center; background: var(--bg); color: var(--ink);
  }
  input.wide { width: 130px; text-align: left; }
  input:focus { outline: 2px solid var(--teal-glow); border-color: var(--teal); }

  .flag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11.5px; font-weight: 700; }
  .flag.green { background: var(--green-bg); color: var(--green); }
  .flag.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .flag.red { background: var(--red-bg); color: var(--red); }
  .flag.alert-large { background: #4a2408; color: #fb923c; margin-left: 4px; }
  /* Groups the week table's columns into two visually distinct bands — "This Week" (the flow
     check: did what got bought this week get sold) vs "Running Total" (the accumulated pile,
     including stock carried over from before) — so it's obvious at a glance that a column's
     number and a column's badge might be answering two different questions, not contradicting
     each other. */
  th.group-header { text-align: center; font-size: 10px; padding: 5px 8px 4px; }
  th.group-header.this-week { background: rgba(45,212,191,.08); color: var(--teal); }
  th.group-header.running-total { background: rgba(251,146,60,.1); color: #fb923c; }
  th.group-header .sub { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .8; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
  .kpi .value { font-size: 21px; font-weight: 700; color: var(--ink); }
  .kpi .value.red { color: var(--red); }
  .kpi .value.green { color: var(--green); }

  textarea.note {
    width: 110px; height: 30px; font-size: 11.5px; border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 5px; resize: vertical; font-family: inherit; text-align: left; background: var(--bg); color: var(--ink);
  }

  .settings-item { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .settings-item label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .settings-field { display: flex; flex-direction: column; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .btn { margin-top: 10px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--teal); color: var(--teal-ink); padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: 0 4px 20px var(--teal-glow);
  }
  .toast.show { opacity: 1; }

  .compare-bar-wrap { height: 220px; margin-top: 8px; }
  .info-note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; overflow-wrap: break-word; white-space: normal; }
  .info-toggle { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0 0 0 4px; line-height: 1; vertical-align: middle; }
  .info-toggle:hover { color: var(--teal); }

  select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; background: var(--bg); color: var(--ink); }

  .csv-dropzone {
    display: flex; align-items: center; gap: 8px;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
    width: fit-content;
  }
  .csv-dropzone:hover { border-color: var(--teal); color: var(--ink); }
  .csv-dropzone .csv-icon { font-size: 16px; }
  .csv-dropzone .csv-sub { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .card.csv-dragover { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-glow); }
  .card.csv-dragover .csv-dropzone { border-color: var(--teal); background: var(--teal-glow); color: var(--ink); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<script>
const LS_KEY = 'fellow_bev_tracker_v1';
// Which item/week Unaccounted breakdowns are currently expanded — deliberately NOT part of
// `state`/localStorage. This is pure UI state (so Gary can check the math without redoing it by
// hand, per the whole point of this feature); it shouldn't persist across reloads, shouldn't be
// in an exported backup, and needs to survive this app's own full re-render-on-every-edit pattern,
// which a native <details> element's open/closed state would not.
let expandedUnaccounted = new Set();
// Collapsed by default, and deliberately module-level rather than persisted to state: the point of
// the split is that opening the app on a Monday shows nine rows. If this were saved, one expansion
// would silently undo that for every week after it. It survives in-session re-renders (same reason
// expandedUnaccounted does) so editing a cell doesn't snap the group shut mid-review.
let secondaryExpanded = false;
// Period Summary keeps its own toggle rather than sharing the week table's. They answer different
// questions and get read at different times — expanding one to chase a syrup should not silently
// unfold the other on a view you are about to glance at.
let periodSecondaryExpanded = false;

        subtitle: '',
        items: fellowItems,
        periods: [fellowP10]

function emptyWeek(items){
  const w = {};
  items.forEach(it=>{
    w[it.id] = { purchased:0, sold:0, discount:0, kitchen: it.defaultKitchen||0, notes:'', actualCount:'' };
  });
  return w;
}

// Real order windows per vendor, matching Gary's existing ordering sheet — Shamrock (sodas/
// lemonade) gets three separate orders a week, Passport (coffee/tea) gets one. This is what the
// Order Guide's cadence is actually keyed to, not the Variance view's Mon–Sun week grid: a
// suggested/logged quantity now means "this specific order window," not "this calendar week."
// Fellow's order days for Shamrock and Passport aren't confirmed yet, so every vendor falls
// back to a single generic 'Order' slot below. Fill this in once the cadence is known.
const VENDOR_SLOTS = {};
function slotsForVendor(vendor){
  return VENDOR_SLOTS[vendor] || ['Order'];
}

// One entry per item per week PER ORDER WINDOW (slot count depends on the item's vendor — 3 for
// Shamrock, 1 for Passport): what Gary logs as actually ordered (qty, in the item's native unit)
// and when. Separate from `purchased` (what MarginEdge shows arrived/invoiced) on purpose — an
// order and what shows up can legitimately differ (backorder, sub, short-ship), and collapsing
// them would hide that gap instead of surfacing it.
function emptyOrders(items){
  const o = {};
  items.forEach(it=>{ o[it.id] = slotsForVendor(it.vendor).map(()=>({ qty:'', date:'' })); });
  return o;
}

// The items that actually carry the NA Bev number. Everything else is real product and still
// reconciles — it just doesn't belong in the first thing you look at on a Monday. Verified against
// Fellow P7-P9: these nine are where the cost lives. Kept as a set rather than a per-item flag so
// changing the focus list is a one-line edit instead of nine.
const FOCUS_IDS = new Set(['coke','dietcoke','sprite','rootbeer','clubsoda','gingerbeer','espresso','lemonade','wholemilk']);
function isFocusItem(item){ return FOCUS_IDS.has(item.id); }

function newPeriod(items, name, startDate){
  return {
    name: name || 'Period 1',
    startDate: startDate || '',
    beginInv: {}, // item.id -> beginning on-hand units, entered once
    weeks: [emptyWeek(items), emptyWeek(items), emptyWeek(items), emptyWeek(items)],
    orders: [emptyOrders(items), emptyOrders(items), emptyOrders(items), emptyOrders(items)],
    // Gross NA Bev sales for the period, typed in from the P&L / Toast. Needed for anything
    // expressed as a percentage of sales — cost %, purchase rate, and the percentage-point effect
    // of a transfer. Blank is honest: every percentage that depends on it hides rather than
    // showing a number divided by zero.
    naBevSales: '',
    // Product that physically left NA Bev inventory but was consumed by another department, so its
    // cost belongs on that department's line. Each entry: {itemId, units (native), dest, note}.
    // Units are native (bottles, lb, gal) because that's what somebody actually counts or measures.
    transfers: []
  };
}

// ---------- State load/save ----------
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    return normalizeLoadedState(JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
// Shared by load() (reading localStorage on page start) and importStateFile() (reading a backup
// JSON handed off from someone else's browser, e.g. Nick -> Gary) — both start from a raw parsed
// object of unknown vintage and need the same pruning/backfill pipeline applied before it's safe
// to use as `state`.
function normalizeLoadedState(parsed){
  pruneRemovedStores(parsed);
  migrateItemConfig(parsed);
  migrateOrders(parsed);
  migratePeriodFields(parsed);
  if(parsed.unaccountedAlertThreshold === undefined) parsed.unaccountedAlertThreshold = 50;
  return parsed;
}
// Same backfill idea as migrateItemConfig/migrateOrders, for the two period-level fields added
// for the cost-rate and transfer blocks. A period saved before those shipped has neither, and
// reading `.transfers.forEach` off undefined would blank the whole app on load — which is exactly
// the class of bug that made week-switching die before. Never touches a period that already has
// them, so a typed-in sales figure or a logged transfer survives every future migration.
function migratePeriodFields(parsed){
  if(!parsed || !parsed.stores) return;
  Object.values(parsed.stores).forEach(store=>{
    if(!store || !Array.isArray(store.periods)) return;
    store.periods.forEach(p=>{
      if(p.naBevSales === undefined) p.naBevSales = '';
      if(!Array.isArray(p.transfers)) p.transfers = [];
    });
  });
}
// Saved state in localStorage is whatever shape it was the last time save() ran — it does NOT
// pick up new fields added to an item's definition in defaultState() afterward (e.g. adding
// Lemonade's `recipeUsage` link here later didn't retroactively add it to a browser's
// already-saved Lemonade item, which silently broke Arnold Palmer recipe matching for anyone
// who'd already used the app before that feature shipped). This backfills any default-item
// config key that's missing on a saved item, matched by id, without touching keys the saved
// item already has (so user edits like a changed price are never overwritten).
// Gilbert and Scottsdale were removed from the app (Central Phoenix is the only store now) —
// this drops them from a browser's already-saved state too, so an old localStorage doesn't leave
// stale empty-store tabs sitting in the tab bar. Only ever removes stores that no longer exist in
// defaultState(); never touches central's real data.
function pruneRemovedStores(parsed){
  if(!parsed || !parsed.stores) return;
  const validKeys = Object.keys(defaultState().stores);
  Object.keys(parsed.stores).forEach(key=>{
    if(!validKeys.includes(key)) delete parsed.stores[key];
  });
  if(!validKeys.includes(parsed.activeStore)) parsed.activeStore = validKeys[0];
}
function migrateItemConfig(parsed){
  if(!parsed || !parsed.stores) return;
  const defaults = defaultState();
  Object.keys(parsed.stores).forEach(storeKey=>{
    const savedStore = parsed.stores[storeKey];
    const defaultStore = defaults.stores[storeKey];
    if(!savedStore || !defaultStore || !Array.isArray(savedStore.items)) return;
    savedStore.items.forEach(savedItem=>{
      const defaultItem = defaultStore.items.find(it=>it.id===savedItem.id);
      if(!defaultItem) return;
      Object.keys(defaultItem).forEach(key=>{
        if(savedItem[key] === undefined) savedItem[key] = defaultItem[key];
      });
    });
  });
}
// Same idea as migrateItemConfig, but for the `orders` array added to the period shape for the
// Order Guide. Handles three cases without touching any order qty/date Gary's already entered:
//   1. A period saved before the Order Guide shipped at all — no orders array yet.
//   2. A period saved after a new item was added to the store, but before that item existed —
//      missing key inside each week's orders object.
//   3. A period saved under the very first Order Guide version, before real vendor order windows
//      were added — orders were a single {qty,date} per item per week, not one per order slot.
//      Wraps that single entry into a 1-element array; if the item's vendor now calls for more
//      slots (e.g. 3 for Shamrock), the extra slots start blank rather than inventing data.
function migrateOrders(parsed){
  if(!parsed || !parsed.stores) return;
  Object.keys(parsed.stores).forEach(key=>{
    const store = parsed.stores[key];
    if(!store || !Array.isArray(store.periods)) return;
    store.periods.forEach(period=>{
      if(!Array.isArray(period.orders)){
        period.orders = period.weeks.map(()=>emptyOrders(store.items));
      } else {
        period.orders.forEach(o=>{
          store.items.forEach(it=>{
            const nSlots = slotsForVendor(it.vendor).length;
            let cur = o[it.id];
            if(!cur){
              cur = [];
            } else if(!Array.isArray(cur)){
              cur = [cur]; // old single-slot {qty,date} format
            }
            while(cur.length < nSlots) cur.push({qty:'', date:''});
            if(cur.length > nSlots) cur = cur.slice(0, nSlots);
            o[it.id] = cur;
          });
        });
      }
    });
  });
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

// ---------- Backup / handoff ----------
// This app has no server and no accounts — every browser's data lives only in that browser's
// localStorage. There's no automatic sync between, say, Nick's laptop and Gary's phone even
// though they're both pointed at the same GitHub Pages URL. Export/Import exists solely to move a
// full snapshot from one browser to another by hand (e.g. handing the tracker off to someone
// else, or moving to a new device) — it is NOT a live sync mechanism. Whoever imports a backup
// gets a point-in-time copy; the two browsers will drift apart the moment either one is edited
// again, until someone exports/imports again.
function exportStateFile(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `nabev-tracker-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
function importStateFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let parsed;
    try{ parsed = JSON.parse(ev.target.result); }
    catch(e){ alert('Could not read that file — it doesn\'t look like valid JSON.'); return; }
    if(!parsed || typeof parsed !== 'object' || !parsed.stores){
      alert('That file doesn\'t look like a NA Bev Tracker backup (missing expected data).');
      return;
    }
    if(!confirm('This replaces everything currently in this browser — every period, item, and order — with what\'s in the imported file. This cannot be undone. Continue?')) return;
    state = normalizeLoadedState(parsed);
    save();
    render();
    showToast('Backup imported');
  };
  reader.readAsText(file);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// Buttons are recreated on every render() (the whole #app tree is rebuilt from scratch on any
// state change), and in some browser environments a listener attached directly to a freshly
// created element via addEventListener doesn't reliably receive real clicks (confirmed: a
// document-level listener sees the click, a per-element one on the same element sometimes
// doesn't). wireClick sidesteps that entirely: it stores the handler as a plain property instead
// of registering a DOM listener, and a single delegated listener on `document` (installed once,
// see bottom of script) finds the clicked element and calls its stored handler directly.
function wireClick(el, fn){
  if(!el) return;
  el.dataset.clickable = '';
  el.__clickHandler = fn;
}

// ---------- Math helpers ----------
// Returns unit-equivalent purchased quantity (servings for gallon items, cans for can items)
// How many ounces (fluid or weight, whichever the item is measured in) are in ONE purchase unit.
// Generalized for Fellow: this used to be a hardcoded 128 behind `item.unit === 'gallon'`, which
// could only express gallon jugs. Fellow reconciles espresso and loose tea by the pound, drip
// coffee and iced tea by the case, milk by the quart and syrup by the litre — none of which are
// 128 oz, and unlike Central Phoenix those are not order-only here. A gallon item with no explicit
// unitOz still resolves to 128, so nothing that worked before changes.
function unitOz(item){
  const v = parseFloat(item.unitOz);
  if(isFinite(v) && v > 0) return v;
  return item.unit === 'gallon' ? 128 : null;
}
// "Bulk" = counted in a container (jug, bag, case, bottle) but sold in portions out of it. Needs
// both a container size and a portion size; without either it is a straight each-count item.
function isBulk(item){
  const u = unitOz(item);
  return !!(u && parseFloat(item.pourOz) > 0);
}
function servingsPerUnit(item){ return isBulk(item) ? unitOz(item) / parseFloat(item.pourOz) : 1; }
// What one purchase unit is called on screen: gal / lb / case / qt / btl.
function nativeLabel(item){ return item.unitLabel || (item.unit === 'gallon' ? 'gal' : 'unit'); }

function purchasedServings(item, purchasedRaw){
  if(isBulk(item)){
    return purchasedRaw * servingsPerUnit(item);
  }
  return purchasedRaw;
}
// Inverse of purchasedServings: converts a servings-equivalent number back to the item's native
// unit (gallons for gallon items). Needed anywhere a servings-based value (like expectedOnHand's
// output) needs to be stored back into a native-unit field like beginInv or Count, which always
// get re-converted via purchasedServings() when read.
function servingsToNative(item, servings){
  if(isBulk(item)){
    return servings / servingsPerUnit(item);
  }
  return servings;
}
function costPerServing(item){
  if(isBulk(item)){
    return item.cost / servingsPerUnit(item);
  }
  return item.cost;
}
// carryIn = stock already on hand entering this week (beginning inventory rolled forward through
// prior weeks' purchased-vs-accounted flow — see balanceEnteringWeek). Defaults to 0, which
// reproduces the old pure this-week-only Purchased-vs-Sold check; callers that aggregate across a
// whole period (Period Summary, Compare Stores, the email export) intentionally omit it, since
// the correct period-level total is still the sum of each week's own flow, not a running balance.
// The live per-week table passes carryIn so an item that's fully stocked from a prior delivery and
// simply wasn't purchased again this week doesn't show a false-alarm negative/red flag.
function computeRow(item, weekData, carryIn){
  carryIn = carryIn || 0;
  const d = weekData[item.id] || {purchased:0,sold:0,discount:0,kitchen:0,notes:'',actualCount:''};
  const purchased = parseFloat(d.purchased) || 0;
  const sold = parseFloat(d.sold) || 0;
  const discount = parseFloat(d.discount) || 0;
  const kitchen = parseFloat(d.kitchen) || 0;
  const purchU = purchasedServings(item, purchased);
  // Rounded to a whole unit, not left as a raw ratio — a comp is always a whole physical item (a
  // whole can, a whole 6oz pour), never a fraction of one, so discount$ ÷ price landing on
  // something like 11.1 is estimation noise, not a real 0.1 of a comped item. Left unrounded, that
  // noise fed straight into Accounted For and made it look like the app could report "25.1 Dr
  // Peppers accounted for" — physically meaningless, and Nick caught it immediately.
  const comped = item.price > 0 ? Math.round(discount / item.price) : 0;
  // Reverted 2026-09-13 — the 2026-09-08 "fix" below was wrong and had it backwards. Verified
  // against a real Diet Coke row (Qty sold 52, Gross $234.00 = 52 × $4.50): Gross is definitionally
  // Qty Sold × Price, so if the 24 comped units (Discount $108 ÷ $4.50) were excluded from "Qty
  // sold," Gross would have been built from 28 units ($126), not 52 ($234). It wasn't — so Toast's
  // "Qty sold" already includes comped transactions (a comp is a 100%-discounted sale, not a void;
  // it still counts as sold, just at $0 revenue). `comped` is still useful as a breakdown of how
  // much of `sold` was comped (staff perk rate, "show the math"), but it must NOT be added again on
  // top of `sold` here — doing so double-counted every comp, inflating Accounted For and making
  // every period's unaccounted number look smaller than it really was. This is back to the original
  // pre-2026-09-08 formula; that "fix" is the thing that was actually broken.
  const accountedFor = sold + kitchen;
  // Sold to guests / guest revenue: the profit-vs-perk breakdown Nick asked for — how much of
  // Sold was actually paid for by a guest (real revenue) vs. comped (staff perk, zero revenue).
  // Not clamped at 0 on purpose: if this goes negative, it means the comped estimate (discount ÷
  // price, rounded) came out larger than Sold itself, which is a real data problem worth seeing —
  // hiding it behind a floor of 0 would bury the exact kind of mismatch this app exists to surface.
  const soldToGuests = sold - comped;
  const guestRevenue = soldToGuests * item.price;
  const available = carryIn + purchU; // what could have been sold this week: prior stock + new purchases
  const unaccounted = available - accountedFor; // allow negative to show over-accounted
  const cps = costPerServing(item);
  const unaccountedCost = unaccounted * cps;
  // Profit: real bottom-line profit on what actually sold to a guest — revenue minus the cost of
  // goods for those units. Uses cps (cost per serving), not item.cost directly, so gallon items
  // (Lemonade) profit correctly per drink poured rather than per gallon jug.
  const profit = soldToGuests * (item.price - cps);
  // Comp cost: what comping actually cost in wholesale terms, as opposed to Comped $ (the menu-
  // price value given away). Not a visible column — shown in the "show the math" breakdown
  // instead, so Profit doesn't need a second column next to it just to explain the perk's cost.
  const compCost = comped * cps;
  // Removed 2026-09-13: this week's Purchased-vs-Accounted ratio ("% of purchases") and its
  // OK/WATCH/FLAG badge used to live here. Nick flagged the name as confusing and, on reflection,
  // the metric itself was redundant with Expected on hand/Expected on hand ($) + the "⚠ Check fridge" badge —
  // running two separate alert signals off overlapping data was more for Gary to parse, not less.
  // Check fridge (driven by unaccountedAlertThreshold, computed in renderStoreView) is now the only
  // alert in the app.
  return { purchased, purchU, sold, discount, comped, soldToGuests, guestRevenue, profit, compCost, kitchen, accountedFor, unaccounted, unaccountedCost, cps,
           actualCount: d.actualCount, notes: d.notes || '' };
}

// Stock on hand entering a given week index (0-3): beginning inventory for week 0, or the running
// expected on-hand carried out of the prior week otherwise. Both this and expectedOnHand work in
// serving-equivalent units throughout (matching purchU/accountedFor), so Beginning On-Hand and
// Count — entered in the item's native unit, e.g. gallons for Lemonade — are converted the same
// way Purchased is via purchasedServings(). Mixing raw gallons into a servings-based running total
// would silently understate carryIn for any gallon item.
function balanceEnteringWeek(store, period, item, weekIdx){
  if(weekIdx <= 0) return purchasedServings(item, parseFloat(period.beginInv[item.id]) || 0);
  return expectedOnHand(store, period, item, weekIdx-1);
}

// Expected on-hand at end of a given week index (0-3), given period beginning inventory
function expectedOnHand(store, period, item, uptoWeekIdx){
  let onHand = purchasedServings(item, parseFloat(period.beginInv[item.id]) || 0);
  for(let w=0; w<=uptoWeekIdx; w++){
    const r = computeRow(item, period.weeks[w]);
    onHand = onHand + r.purchU - r.accountedFor;
    // if an actual count was logged that week, it resets the running on-hand
    const actual = parseFloat(period.weeks[w][item.id]?.actualCount);
    if(!isNaN(actual) && period.weeks[w][item.id]?.actualCount !== ''){
      onHand = purchasedServings(item, actual);
    }
  }
  return onHand;
}

// Trailing average weekly usage (Sold + Kitchen use) for an item, walking backward from
// (uptoPeriodIdx, uptoWeekIdx) inclusive across period boundaries so a brand-new period doesn't
// reset the average to nothing. Skips weeks that look untouched (purchased/sold/kitchen all still
// at their zero defaults) rather than counting them as real zero-usage weeks — there's no way to
// tell "nothing sold" apart from "not entered yet" other than that heuristic, and treating an
// empty future week as a real zero would drag the average down for no reason. Returns null if
// there's no usable week yet (e.g. very first week of the very first period).
function trailingAvgUsage(store, item, uptoPeriodIdx, uptoWeekIdx, n){
  n = n || 4;
  const collected = [];
  let pIdx = uptoPeriodIdx, wIdx = uptoWeekIdx;
  while(collected.length < n && pIdx >= 0){
    const period = store.periods[pIdx];
    while(wIdx >= 0 && collected.length < n){
      const d = period.weeks[wIdx][item.id];
      if(d && ((parseFloat(d.purchased)||0)>0 || (parseFloat(d.sold)||0)>0 || (parseFloat(d.kitchen)||0)>0)){
        collected.push(computeRow(item, period.weeks[wIdx]).accountedFor);
      }
      wIdx--;
    }
    pIdx--;
    if(pIdx>=0) wIdx = store.periods[pIdx].weeks.length-1;
  }
  if(collected.length===0) return null;
  return collected.reduce((a,b)=>a+b,0)/collected.length;
}

// Most recent logged order for an item, strictly before (uptoPeriodIdx, uptoWeekIdx) — i.e. not
// including the week currently being viewed, so "Last order" always means "before this one."
// Walks backward across period boundaries the same way trailingAvgUsage does, and within a week,
// backward across that item's order slots (slot 0 is earliest in the week, so scanning from the
// last slot down finds the most recent one first).
function lastOrder(store, uptoPeriodIdx, uptoWeekIdx, item){
  const slotLabels = slotsForVendor(item.vendor);
  let pIdx = uptoPeriodIdx, wIdx = uptoWeekIdx - 1;
  if(wIdx < 0){ pIdx -= 1; if(pIdx>=0) wIdx = store.periods[pIdx].weeks.length-1; }
  while(pIdx >= 0){
    const period = store.periods[pIdx];
    while(wIdx >= 0){
      const arr = period.orders && period.orders[wIdx] && period.orders[wIdx][item.id];
      if(Array.isArray(arr)){
        for(let s=arr.length-1; s>=0; s--){
          const o = arr[s];
          if(o && parseFloat(o.qty) > 0){
            return { qty: parseFloat(o.qty), date: o.date, label: period.name+', Week '+(wIdx+1)+' — '+(slotLabels[s]||'Order') };
          }
        }
      }
      wIdx--;
    }
    pIdx--;
    if(pIdx>=0) wIdx = store.periods[pIdx].weeks.length-1;
  }
  return null;
}

function fmt$(n){ return '$' + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtN(n){ return (Math.round(n*10)/10).toLocaleString('en-US',{maximumFractionDigits:1}); }
// Order Guide quantities specifically — you can't buy 0.4 of a case or 1.6 jugs, so these round to
// whole numbers rather than the 1-decimal display used everywhere else (Variance/Period Summary
// keep decimals since those are reconciliation math, not a literal thing you write on an order).
// Suggested rounds UP: it's the number Gary actually orders, and rounding a real shortfall down
// (say, 6.4 needed → 6) would under-order on purpose, which defeats the point of a par-based
// suggestion. Everything else here is reference/context, so a plain round is fine.
function fmtWhole(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtWholeUp(n){ return Math.ceil(n).toLocaleString('en-US'); }

// ---------- App state getters ----------
function getActiveStore(){ return state.stores[state.activeStore]; }
function ensureActivePeriod(store){
  if(store.periods.length===0){
    store.periods.push(newPeriod(store.items, 'Period 1', ''));
    store._activePeriodIdx = 0;
    save();
  }
  if(store._activePeriodIdx === undefined) store._activePeriodIdx = store.periods.length-1;
  if(store._activeWeekIdx === undefined) store._activeWeekIdx = 0;
}

// ---------- CSV import ----------
// Minimal dependency-free CSV parser (handles quoted fields, embedded commas, "" escaped quotes).
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row=[];
      } else field += c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  if(rows.length===0) return [];
  const header = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const obj={};
    header.forEach((h,idx)=>{ obj[h]=(r[idx]!==undefined?r[idx]:'').trim(); });
    return obj;
  });
}
function normalizeName(s){
  return (s||'').toLowerCase().replace(/\./g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function findCol(headerKeys, candidates){
  for(const cand of candidates){
    const hit = headerKeys.find(h=>h.toLowerCase().trim()===cand.toLowerCase());
    if(hit) return hit;
  }
  return null;
}
// Uses a persistent <label for="..."> + <input type=file> pair (see renderStoreView) instead of a
// dynamically-created, programmatically-.click()'d input — the label-triggers-input pattern is the
// robust cross-browser way to open a file picker from a styled button and doesn't depend on a
// synthetic .click() call being treated as a trusted user gesture.
//
// One dropzone handles both a Toast-style sales export (Item / Qty sold / Discount amt) and a
// MarginEdge-style purchase report (Product / Purchased Units) — it sniffs the header row and
// routes to the right parser, so there's nothing to pick or get wrong.
// The week Total row has to add up what each cell actually shows — a confirmed count where one
// was logged, the projection everywhere else — or the total disagrees with the column above it.
function hasCountForTotals(item, weekData, r){
  const raw = weekData[item.id].actualCount;
  const has = raw !== '' && raw !== undefined && !isNaN(parseFloat(raw));
  if(!has) return { units: r.unaccounted, cost: r.unaccountedCost };
  const u = purchasedServings(item, parseFloat(raw));
  return { units: u, cost: u * r.cps };
}
function matchItemByName(store, rawName){
  const norm = normalizeName(rawName);
  const exact = store.items.find(it=>normalizeName(it.name)===norm);
  if(exact) return exact;
  // Toast and MarginEdge call the same product different things — MarginEdge says
  // "Soda, Coke 12oz Can", Toast says "Coca-Cola". The substring fallback below only fires when
  // the tracked name sits INSIDE the row name, which never happens in that direction, so every
  // Toast sales row would land in "unmatched". `aliases` lists the POS spellings per item.
  const aliased = store.items.find(it=>(it.aliases||[]).some(a=>normalizeName(a)===norm));
  if(aliased) return aliased;
  // Fallback for verbose report names like "Soda, Diet Coke 12oz Can": match if the tracked
  // item's name appears inside the row as a whole substring, preferring the longest/most
  // specific match so "Diet Coke" wins over "Coke" on a "Diet Coke" row.
  let best = null, bestLen = 0;
  store.items.forEach(it=>{
    const itNorm = normalizeName(it.name);
    if(itNorm && norm.includes(itNorm) && itNorm.length > bestLen){
      best = it; bestLen = itNorm.length;
    }
  });
  return best;
}
function processAnyCsvFile(file, store, weekData, weekIdx){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const text = String(ev.target.result).replace(/^﻿/, ''); // strip BOM some exports include
    const rows = parseCSV(text);
    if(rows.length===0){ alert('Could not read any rows from that CSV.'); return; }
    const headerKeys = Object.keys(rows[0]);
    const itemCol    = findCol(headerKeys, ['Item']);
    const qtySoldCol = findCol(headerKeys, ['Qty sold','Qty Sold']);
    const discCol    = findCol(headerKeys, ['Discount amt','Discount Amt']);
    const productCol = findCol(headerKeys, ['Product']);
    const unitsCol   = findCol(headerKeys, ['Purchased Units']);

    if(itemCol && qtySoldCol){
      const matches = [], unmatched = [], recipeMatches = [];
      rows.forEach(r=>{
        const rawName = r[itemCol];
        if(!rawName || !rawName.trim()) return; // skip blank/total row
        const qty = parseFloat(r[qtySoldCol])||0;
        const disc = discCol ? (parseFloat(r[discCol])||0) : 0;
        // Recipe-linked items (e.g. Arnold Palmer, which isn't rung in as "Lemonade" but is a
        // guest sale that consumes lemonade as an ingredient) aren't tracked directly — they feed
        // an addition on whichever tracked item lists them, instead of being matched/unmatched
        // themselves. `addsTo` controls whether that addition counts as a guest Sold (the default —
        // most recipe links are drinks guests order) or internal Kitchen use (e.g. a recipe that
        // uses the item but isn't itself sold to a guest).
        const norm = normalizeName(rawName);
        // Fixed: this used to keep only the LAST matching item, so a drink built from several
        // tracked ingredients drew down only one of them. A Latte is espresso AND milk; a Mocha
        // Latte is espresso, milk AND chocolate; an Arnold Palmer is tea AND lemonade.
        const recipeHits = [];
        store.items.forEach(it=>{
          (it.recipeUsage||[]).forEach(ru=>{
            if(normalizeName(ru.matchName)===norm) recipeHits.push({item: it, ozPerUnit: ru.ozPerUnit, addsTo: ru.addsTo || 'sold'});
          });
        });
        if(recipeHits.length){
          recipeHits.forEach(h=>{
            const rawServings = h.item.pourOz ? (qty*h.ozPerUnit)/h.item.pourOz : qty*h.ozPerUnit;
            const servings = Math.round(rawServings*10)/10;
            recipeMatches.push({item: h.item, sourceName: rawName, sourceQty: qty, addedServings: servings, addsTo: h.addsTo});
          });
          return;
        }
        const item = matchItemByName(store, rawName);
        if(item) matches.push({item, qty, disc, rawName});
        else unmatched.push(rawName);
      });
      showCsvPreview(weekData, weekIdx, matches, unmatched, file.name, recipeMatches);
    } else if(productCol && unitsCol){
      const matches = [], unmatched = [];
      rows.forEach(r=>{
        const rawName = r[productCol];
        if(!rawName || !rawName.trim()) return;
        const item = matchItemByName(store, rawName);
        const qty = parseFloat(r[unitsCol])||0;
        if(item) matches.push({item, qty, rawName});
        else unmatched.push(rawName);
      });
      showPurchasePreview(weekData, weekIdx, matches, unmatched, file.name);
    } else {
      alert('Could not recognize this CSV\'s format. Expected either a Toast sales export ("Item" + "Qty sold" columns) or a MarginEdge purchase report ("Product" + "Purchased Units" columns).');
    }
  };
  reader.readAsText(file);
}
function showCsvPreview(weekData, weekIdx, matches, unmatched, fileName, recipeMatches){

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;';

  let html = `<h2 style="margin-top:0">Import Sales: ${fileName}</h2>`;
  html += `<div class="info-note" style="margin-bottom:10px">Adds these quantities and discount $ to Week ${weekIdx+1}'s current values — doesn't overwrite, so it's safe to import multiple channel files for the same week.</div>`;
  if(matches.length===0){
    html += `<div class="info-note" style="color:var(--red)">No rows matched a tracked item.</div>`;
  } else {
    html += `<table><thead><tr><th class="left">Item</th><th>CSV qty</th><th>CSV disc $</th><th>Current sold</th><th>New sold</th></tr></thead><tbody>`;
    matches.forEach(m=>{
      const cur = weekData[m.item.id];
      const curSold = parseFloat(cur.sold)||0;
      html += `<tr><td class="left">${m.item.name}</td><td>${fmtN(m.qty)}</td><td>${fmt$(m.disc)}</td><td>${fmtN(curSold)}</td><td style="font-weight:700">${fmtN(curSold+m.qty)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  if(recipeMatches.length){
    html += `<h3 style="margin-top:16px">Recipe use detected</h3>`;
    html += `<div class="info-note" style="margin-bottom:8px">These aren't tracked items themselves, but they're made using a tracked item as an ingredient — adding to that item's Sold (a guest ordered it, just under a different name) or Kitchen use (an internal, non-guest use), depending on the item.</div>`;
    html += `<table><thead><tr><th class="left">Source (CSV)</th><th>Qty sold</th><th class="left">Adds to</th><th class="left">As</th><th>Current</th><th>New</th></tr></thead><tbody>`;
    recipeMatches.forEach(m=>{
      const cur = weekData[m.item.id];
      const curVal = parseFloat(cur[m.addsTo])||0;
      const label = m.addsTo === 'sold' ? 'Sold' : 'Kitchen use';
      html += `<tr><td class="left">${m.sourceName}</td><td>${fmtN(m.sourceQty)}</td><td class="left">${m.item.name}</td><td class="left">${label}</td><td>${fmtN(curVal)}</td><td style="font-weight:700">${fmtN(curVal+m.addedServings)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  if(unmatched.length){
    html += `<div class="info-note" style="margin-top:10px;color:var(--yellow)">Unmatched CSV rows (not imported — check item name spelling, or these aren't tracked items): ${unmatched.join(', ')}</div>`;
  }
  const hasAnything = matches.length>0 || recipeMatches.length>0;
  html += `<div class="rowflex" style="margin-top:16px"><button class="btn ghost" id="csvCancel">Cancel</button><button class="btn" id="csvConfirm" ${hasAnything?'':'disabled'}>Add to Week ${weekIdx+1}</button></div>`;
  box.innerHTML = html;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  wireClick(box.querySelector('#csvCancel'), ()=> document.body.removeChild(overlay));
  const confirmBtn = box.querySelector('#csvConfirm');
  if(hasAnything){
    wireClick(confirmBtn, ()=>{
      matches.forEach(m=>{
        const cur = weekData[m.item.id];
        cur.sold = (parseFloat(cur.sold)||0) + m.qty;
        cur.discount = (parseFloat(cur.discount)||0) + m.disc;
      });
      recipeMatches.forEach(m=>{
        const cur = weekData[m.item.id];
        cur[m.addsTo] = Math.round(((parseFloat(cur[m.addsTo])||0) + m.addedServings)*10)/10;
      });
      save();
      document.body.removeChild(overlay);
      showToast('Imported into Week '+(weekIdx+1));
      render();
    });
  }
}

// ---------- Render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const header = document.createElement('div');
  header.innerHTML = `<h1>NA Bev Variance Tracker</h1><div class="sub">Weekly purchased-vs-accounted-for reconciliation, per item, per store.</div>`;
  app.appendChild(header);

  // Top-level tabs: stores + compare + settings
  const tabbar = document.createElement('div');
  tabbar.className = 'tabbar';
  Object.keys(state.stores).forEach(key=>{
    const b = document.createElement('button');
    b.className = 'tab' + (state.activeView==='store' && state.activeStore===key ? ' active':'');
    // Tab label describes the view's function (matching Order Guide/Compare Periods/Settings)
    // rather than the store's name — with a single store, the name no longer distinguishes
    // anything, and it never told you what was on the tab anyway. The store's actual name is
    // untouched everywhere else (Order Guide header, email subject, Compare Periods).
    b.textContent = 'Sales vs Purchasing';
    wireClick(b, ()=>{ state.activeStore=key; state.activeView='store'; save(); render(); });
    tabbar.appendChild(b);
  });
  const orderBtn = document.createElement('button');
  orderBtn.className = 'tab' + (state.activeView==='order' ? ' active':'');
  orderBtn.textContent = '📦 Order Guide';
  wireClick(orderBtn, ()=>{ state.activeView='order'; save(); render(); });
  tabbar.appendChild(orderBtn);

  const compareBtn = document.createElement('button');
  compareBtn.className = 'tab' + (state.activeView==='compare' ? ' active':'');
  compareBtn.textContent = '⇄ Compare Periods';
  wireClick(compareBtn, ()=>{ state.activeView='compare'; save(); render(); });
  tabbar.appendChild(compareBtn);

  const settingsBtn = document.createElement('button');
  settingsBtn.className = 'tab' + (state.activeView==='settings' ? ' active':'');
  settingsBtn.textContent = '⚙ Settings';
  wireClick(settingsBtn, ()=>{ state.activeView='settings'; save(); render(); });
  tabbar.appendChild(settingsBtn);

  app.appendChild(tabbar);

  if(state.activeView==='compare'){ renderCompare(app); return; }
  if(state.activeView==='settings'){ renderSettings(app); return; }
  if(state.activeView==='order'){ renderOrderGuide(app); return; }
  renderStoreView(app);
}

function renderStoreView(app){
  const store = getActiveStore();
  if(store.items.length===0){
    const card = document.createElement('div');
    card.className='card empty-state';
    card.innerHTML = `<div>No items configured for <strong>${store.name}</strong> yet.</div>
      <button class="btn" id="goSettings">Set up items in Settings</button>`;
    app.appendChild(card);
    wireClick(card.querySelector('#goSettings'), ()=>{ state.activeView='settings'; save(); render(); });
    return;
  }
  ensureActivePeriod(store);
  const period = store.periods[store._activePeriodIdx];

  // Period bar
  const pcard = document.createElement('div');
  pcard.className = 'card';
  pcard.innerHTML = `<div class="rowflex">

    const o=document.createElement('option'); o.value=i; o.textContent=p.name; if(i===store._activePeriodIdx) o.selected=true;

  pcard.querySelector('#periodStart').oninput = (e)=>{ period.startDate = e.target.value; save(); };
  wireClick(pcard.querySelector('#newPeriodBtn'), ()=>{
    const carry = {};
    // expectedOnHand returns a servings-equivalent number; beginInv is a native-unit field
    // (gallons for Lemonade, per the "(gal)" input label), so it needs converting back or a
    // gallon item's next period starts over 21x too high (128oz/gal ÷ 6oz pour).
    // Order-only items (Passport coffee/tea) never participate in this reconciliation flow at
    // all — but a purchase CSV can still incidentally match one of them (e.g. a broader
    // MarginEdge report with a "Coffee, Whole Bean" line), leaving a stray non-zero purchased
    // value sitting on some week. Carrying that through expectedOnHand would produce a
    // meaningless computed "beginning inventory" for an item that was never actually tracked —
    // so these are skipped here rather than carried forward.
    store.items.filter(it=>!it.orderOnly).forEach(it=>{ carry[it.id] = servingsToNative(it, expectedOnHand(store, period, it, 3)); });
    const np = newPeriod(store.items, 'Period ' + (store.periods.length+1), '');
    np.beginInv = carry;
    store.periods.push(np);
    store._activePeriodIdx = store.periods.length-1;
    store._activeWeekIdx = 0;
    save(); render();
  });

  // Beginning inventory row (period-level, optional)
  const invCard = document.createElement('div');
  invCard.className = 'card';
  invCard.innerHTML = `<h3>Beginning on-hand (optional — enables count reconciliation)</h3>`;
  const invRow = document.createElement('div');
  invRow.style.display='flex'; invRow.style.gap='14px'; invRow.style.flexWrap='wrap';
  // Order-only items (Passport coffee/tea) don't participate in variance reconciliation at all —
  // showing them here would imply they're tracked when they're not.
  store.items.filter(it=>!it.orderOnly).forEach(it=>{
    const f = document.createElement('div'); f.className='settings-field';
    f.innerHTML = `<label>${it.name} (${isBulk(it) ? nativeLabel(it) : 'units'})</label>`;
    const inp = document.createElement('input'); inp.type='text'; inp.value = period.beginInv[it.id] ?? '';
    inp.oninput = (e)=>{ period.beginInv[it.id] = e.target.value; save(); };
    f.appendChild(inp);
    invRow.appendChild(f);
  });
  invCard.appendChild(invRow);
  app.appendChild(invCard);

  // Ending on-hand — NOT a separate field. This reads/writes the exact same data as Week 4's
  // Count column (period.weeks[3][item.id].actualCount); it's surfaced here as its own card so
  // the period's close-out count is visible without switching to the Week 4 tab, and easy to
  // fix if something was missed. There's only one number underneath either way — editing it
  // here or editing it inline on Week 4 both write to the same place, so they can never drift
  // out of sync with each other.
  const endCard = document.createElement('div');
  endCard.className = 'card';
  endCard.innerHTML = `<h3>Ending on-hand (optional — this period's close-out count, same field as Week 4's Count column)</h3>`;
  const endRow = document.createElement('div');
  endRow.style.display='flex'; endRow.style.gap='14px'; endRow.style.flexWrap='wrap';
  const lastWeekData = period.weeks[3];
  store.items.filter(it=>!it.orderOnly).forEach(it=>{
    const f = document.createElement('div'); f.className='settings-field';
    f.innerHTML = `<label>${it.name} (${isBulk(it) ? nativeLabel(it) : 'units'})</label>`;
    const inp = document.createElement('input'); inp.type='text'; inp.value = lastWeekData[it.id].actualCount ?? '';
    inp.addEventListener('change', (e)=>{ lastWeekData[it.id].actualCount = e.target.value; save(); render(); });
    f.appendChild(inp);
    endRow.appendChild(f);
  });
  endCard.appendChild(endRow);
  app.appendChild(endCard);

  // Week tabs
  const wcard = document.createElement('div');
  wcard.className='card';
  const wt = document.createElement('div'); wt.className='weektabs';
  [0,1,2,3].forEach(i=>{
    const b=document.createElement('button');
    b.className='weektab'+(store._activeWeekIdx===i?' active':'');
    b.textContent='Week '+(i+1);
    wireClick(b, ()=>{ store._activeWeekIdx=i; save(); render(); });
    wt.appendChild(b);
  });
  wcard.appendChild(wt);

  const weekIdx = store._activeWeekIdx;
  const weekData = period.weeks[weekIdx];

  const importInput = document.createElement('input');
  importInput.type = 'file';
  importInput.accept = '.csv';
  importInput.id = 'csvFileInput';
  importInput.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;';
  importInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(file) processAnyCsvFile(file, store, weekData, weekIdx);
    importInput.value = '';
  };
  const importLabel = document.createElement('label');
  importLabel.setAttribute('for', 'csvFileInput');
  importLabel.className = 'csv-dropzone';
  importLabel.innerHTML = `<span class="csv-icon">📥</span><span>Drag a <strong>sales</strong> or <strong>purchases</strong> CSV here, or click to import <span class="csv-sub">— Week ${weekIdx+1}, auto-detected</span></span>`;
  wcard.appendChild(importInput);
  wcard.appendChild(importLabel);

  // The whole card is the drop target (not just the small dashed box) so an imprecise drop still
  // lands correctly, and a window-level dragover/drop guard stops the browser's default
  // navigate-to-file behavior if a drop ever lands outside it. processAnyCsvFile sniffs the CSV's
  // header row to tell a Toast sales export apart from a MarginEdge purchase report, so either
  // file type can be dropped on the same zone.
  wcard.addEventListener('dragover', (e)=>{ e.preventDefault(); wcard.classList.add('csv-dragover'); });
  wcard.addEventListener('dragleave', (e)=>{

    const file = e.dataTransfer.files && e.dataTransfer.files[0];

  });

  const table = document.createElement('table');
  table.innerHTML = `<thead>
